grammar:
  title_ar: الْأَسْمَاءُ الْخَمْسَةُ
  title_en: "The five nouns: أَبٌ, أَخٌ, ذُو and their long letters"
  body: >-
    Five nouns show their case with a long letter instead of a short vowel when they are مُضَافٌ (the first word of an idafa): أَبٌ, أَخٌ, حَمٌ (father-in-law),
    فَمٌ (as فُو) and ذُو. When مَرْفُوعٌ (raf') they take و: أَبُو زَيْدٍ, أَخُوهُ. When مَنْصُوبٌ (nasb) they take ا: يَا أَبَا بَكْرٍ, ذَا لِحْيَةٍ.
    When مَجْرُورٌ (jarr) they take ي: بَيْتِ أَبِي زَيْدٍ, عَلَى أَبِي بِلَالٍ. ذُو is always مُضَافٌ, so it always shows its case this way.
    With the ي of "my", the rule stops: أَبِي is simply my father, in every case.
  examples:
    - [وَأَبُو زَيْدٍ رَجُلٌ طَوِيلٌ ذُو وَجْهٍ بَاسِمٍ, "Abu Zayd is a tall man with a smiling face. (raf')"]
    - [كَانَ صَاحِبُ الْمَكْتَبَةِ شَيْخًا ذَا لِحْيَةٍ بَيْضَاءَ, "The bookshop owner was an old man with a white beard. (nasb)"]
    - [وَقَالَ أَبُو بِلَالٍ لِأَبِي زَيْدٍ شُكْرًا لَكُمْ, "Bilal's father said to Abu Zayd: Thank you. (raf' and jarr)"]

tip:
  title: "Reading without vowels: the case you can still see"
  body: >-
    In a text with no vowels almost every case ending disappears, but not in the five nouns. ابو, ابا and ابي, or اخو, اخا and اخي,
    carry their case in the spelling itself. So in وقال ابو بلال لابي زيد you can see at once who spoke (ابو, the doer) and who was spoken
    to (لابي, after a preposition). One trap: ابي alone at the end of a phrase is usually "my father", while ابي followed by a name
    (ابي زيد, ابي بكر) is Abu Zayd or Abu Bakr in the jarr.

reread: Read the unvowelled version above again. Then find every أبو, أبا, أبي, أخو, ذو and ذا, and say why it has that letter.
