grammar:
  title_ar: أَبْوَابُ الْفِعْلِ الثُّلَاثِيِّ
  title_en: "The abwab: which vowel the مُضَارِعُ (present verb) takes"
  body: >-
    A three-letter verb has a vowel on its middle letter in the فِعْلٌ مَاضٍ (past verb) and another in the مُضَارِعُ (present verb). The pair is fixed for each verb and is
    learned with it, like a surname. Madrasa books name each pattern by a model verb: بَابُ نَصَرَ (a, then u): خَرَجَ يَخْرُجُ.
    بَابُ ضَرَبَ (a, then i): جَلَسَ يَجْلِسُ, رَجَعَ يَرْجِعُ, عَرَفَ يَعْرِفُ. بَابُ فَتَحَ (a, then a): ذَهَبَ يَذْهَبُ, usually when
    the middle or last letter is a throat letter (ء ه ع ح غ خ). بَابُ سَمِعَ (i, then a): حَزِنَ يَحْزَنُ, لَحِقَ يَلْحَقُ, صَعِدَ يَصْعَدُ.
    بَابُ كَرُمَ (u, then u): قَرُبَ يَقْرُبُ, for states and qualities. بَابُ حَسِبَ (i, then i) is rare.
  examples:
    - [خَرَجَ يَخْرُجُ, "bab nasara: he went out, he goes out"]
    - [رَجَعَ يَرْجِعُ, "bab daraba: he went back, he goes back"]
    - [لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا, "bab sami'a (حَزِنَ يَحْزَنُ): Do not grieve, Allah is with us. (Quran 9:40)"]

tip:
  title: "Reading without vowels: the phrases of respect"
  body: >-
    After the Prophet's ﷺ name an unvowelled book always writes صلى الله عليه وسلم. Read it as one unit, ṣallā llāhu ʿalayhi wa sallam,
    without stopping to work out each word. Printed books often shorten it to the single sign ﷺ, and older ones to (ص). Scholars dislike shortening it; when you see a sign, still say the full words. After a
    companion's name comes رضي الله عنه, raḍiya llāhu ʿanhu, and after another prophet's name عليه السلام, ʿalayhi s-salām. When you
    see the first word of one of these phrases, you already know the rest.

reread: Read the unvowelled version above again. Then recite Surat at-Tawba 9:40 and say which sentences of the story it covers.
