# Booklet 3, story 2. Seerah strand. Grammar ceiling: Madinah Book 2.
id: b3-02
booklet: 3
number: 2
strand: seerah
title_ar: الْهِجْرَةُ وَسُرَاقَةُ
title_en: The Hijra and Suraqa
madinah: "Book 2 (the six abwab of the three-letter verb: past and present vowels)"
source: "Sahih al-Bukhari 3905 (Aisha: Abu Bakr told to wait, the two riding camels, the guide, the cave of Thawr for three nights, Abdullah ibn Abi Bakr and Amir ibn Fuhayra, the coast road), 3906 (Suraqa ibn Malik's own account: the blood price, the man who saw figures on the coast, the horse, the Prophet's recitation, the forelegs sinking to the knees, the dust like smoke, the offer of provisions, the written safe-conduct; then the Muslims of Madinah waiting each morning and the man on the fort), 3615 and 3652 (Abu Bakr: the rock's shade, 'the search party has caught up with us' (3652), 'do not grieve, Allah is with us', the prayer against Suraqa and for him, the hard ground (3615, where the narrator Zuhayr was unsure of this word), Suraqa turning back the searchers), 3653 and 3922 (the idolaters' feet above the cave, 'what do you think of two whose third is Allah'), 3911 (Anas: first pursuing, then guarding). Quran 9:40. The spider's web and the dove's nest at the cave are weak reports and are left out."

