title_en: Juha and the Judge
madinah: "Book 2 (ism fa'il and ism maf'ul of the three-letter verb)"
source: "Traditional Juha tale, 'the pot that gave birth and died' (قِدْرُ جُحَا), retold. The ending at the judge's court, where each pot goes back to its owner, is our own, so that the story closes on justice rather than on Juha keeping what is not his."

