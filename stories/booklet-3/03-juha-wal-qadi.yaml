  - {ar: جَارٌ, en: neighbour, pos: [اسم, noun], root: جور, pattern: فَعَلٌ, plural: جِيرَانٌ, ayah: {ref: "4:36", text: وَالْجَارِ ذِي الْقُرْبَىٰ وَالْجَارِ الْجُنُبِ, en: "and the neighbour who is related and the neighbour who is a stranger"}, note: "أَصْلُهُ جَوَرٌ: the middle و turned into alif, so the pattern is فَعَلٌ."}
  - {ar: غَنِيٌّ, en: rich; free of need, pos: [صفة مشبهة, adjective of lasting quality], root: غني, pattern: فَعِيلٌ, plural: أَغْنِيَاءُ, ayah: {ref: "35:15", text: وَاللَّهُ هُوَ الْغَنِيُّ الْحَمِيدُ, en: "and Allah is the Free of all need, the Praiseworthy"}, note: "Used of Allah, it means needing nothing. The opposite of فَقِيرٌ."}
  - {ar: طَمِعَ, en: he was greedy; he hoped for, pos: [فعل ماض, past verb], root: طمع, pattern: فَعِلَ, present: يَطْمَعُ, bab: بَابُ سَمِعَ, ayah: {ref: "26:82", text: وَالَّذِي أَطْمَعُ أَن يَغْفِرَ لِي خَطِيئَتِي, en: "and the One who, I hope, will forgive my fault(s)"}, note: "Greed: الطَّمَعُ. A greedy person: طَامِعٌ (اسْمُ فَاعِلٍ). Hoping in Allah is good; greed for things is not."}
  - {ar: اِسْتَعَارَ, en: he borrowed (a thing), pos: [فعل ماض, past verb], root: عور, pattern: اِسْتَفْعَلَ, present: يَسْتَعِيرُ, bab: بَابُ الِاسْتِفْعَالِ, register: both, note: "Asking for the use of something you will give back. A loan of a thing: عَارِيَةٌ. In modern Arabic, الاِسْتِعَارَةُ is also a metaphor, a word borrowed for another meaning."}
  - {ar: نُحَاسٌ, en: copper; brass, pos: [اسم, noun], root: نحس, pattern: فُعَالٌ, ayah: {ref: "55:35", text: يُرْسَلُ عَلَيْكُمَا شُوَاظٌ مِّن نَّارٍ وَنُحَاسٌ, en: "a flame of fire and molten copper will be sent against you"}}
  - {ar: أَعَادَ, en: he gave back; he repeated, pos: [فعل ماض, past verb], root: عود, pattern: أَفْعَلَ, present: يُعِيدُ, bab: بَابُ الْإِفْعَالِ, ayah: {ref: "20:55", text: مِنْهَا خَلَقْنَاكُمْ وَفِيهَا نُعِيدُكُمْ, en: "from it We created you, and into it We will return you"}, note: "Command: أَعِدْ. After لَمْ the long ي drops: لَمْ يُعِدْ."}
  - {ar: مَوْلُودٌ, en: newborn; child, pos: [اسم مفعول, passive participle], root: ولد, pattern: مَفْعُولٌ, ayah: {ref: "31:33", text: وَلَا مَوْلُودٌ هُوَ جَازٍ عَن وَالِدِهِ شَيْئًا, en: "nor will a child be of any use to his father"}, note: "From وَلَدَ, to give birth: the one who is born. The verb is وَلَدَتْ, she gave birth; present تَلِدُ (the و drops)."}
  - {ar: مَسْرُورٌ, en: pleased; happy, pos: [اسم مفعول, passive participle], root: سرر, pattern: مَفْعُولٌ, ayah: {ref: "84:9", text: وَيَنقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا, en: "and he will return to his people happy"}, note: "From سَرَّ, to make happy: literally made happy."}
  - {ar: سَكَتَ, en: he was silent; he kept quiet, pos: [فعل ماض, past verb], root: سكت, pattern: فَعَلَ, present: يَسْكُتُ, bab: بَابُ نَصَرَ, ayah: {ref: "7:154", text: وَلَمَّا سَكَتَ عَن مُّوسَى الْغَضَبُ, en: "and when the anger of Musa عَلَيْهِ السَّلَامُ was stilled"}, note: "Silent: سَاكِتٌ (اسْمُ فَاعِلٍ)."}
  - {ar: مَاتَ, en: he died, pos: [فعل ماض, past verb], root: موت, pattern: فَعَلَ, present: يَمُوتُ, bab: بَابُ نَصَرَ, ayah: {ref: "3:185", text: كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ, en: "every soul will taste death"}, note: "Death: الْمَوْتُ. The middle و shows in the present and the noun."}
  - {ar: صَدَّقَ, en: he believed (someone or something), pos: [فعل ماض, past verb], root: صدق, pattern: فَعَّلَ, present: يُصَدِّقُ, bab: بَابُ التَّفْعِيلِ, ayah: {ref: "39:33", text: وَالَّذِي جَاءَ بِالصِّدْقِ وَصَدَّقَ بِهِ, en: "and the one who brought the truth and believed in it"}, note: "صَدَقَ (one shadda less) means he told the truth; صَدَّقَ means he believed it. The opposite of صَدَّقَ is كَذَّبَ."}
  - {ar: شَكَا, en: he complained, pos: [فعل ماض, past verb], root: شكو, pattern: فَعَلَ, present: يَشْكُو, bab: بَابُ نَصَرَ, ayah: {ref: "12:86", text: إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ, en: "I only complain of my grief and sorrow to Allah"}, note: "The words of Ya'qub عَلَيْهِ السَّلَامُ in Surat Yusuf."}
  - {ar: مَجْلِسٌ, en: sitting place; council; court, pos: [اسم مكان, noun of place], root: جلس, pattern: مَفْعِلٌ, plural: مَجَالِسُ, ayah: {ref: "58:11", text: إِذَا قِيلَ لَكُمْ تَفَسَّحُوا فِي الْمَجَالِسِ, en: "when you are told to make room in the gatherings"}, note: "From جَلَسَ. مَجْلِسُ الْقَاضِي is the judge's court. In modern Arabic مَجْلِسٌ is also a council or parliament."}
  - {ar: ظَلَمَ, en: he wronged; he was unjust, pos: [فعل ماض, past verb], root: ظلم, pattern: فَعَلَ, present: يَظْلِمُ, bab: بَابُ ضَرَبَ, ayah: {ref: "18:49", text: وَلَا يَظْلِمُ رَبُّكَ أَحَدًا, en: "and your Lord does not wrong anyone"}, note: "The one who wrongs: ظَالِمٌ. The one who is wronged: مَظْلُومٌ."}
  - {ar: حَكَمَ, en: he judged; he ruled, pos: [فعل ماض, past verb], root: حكم, pattern: فَعَلَ, present: يَحْكُمُ, bab: بَابُ نَصَرَ, ayah: {ref: "4:58", text: وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا بِالْعَدْلِ, en: "and when you judge between people, judge with justice"}, note: "A ruling: حُكْمٌ."}
  - {ar: عَدْلٌ, en: justice; fairness, pos: [مصدر, verbal noun], root: عدل, pattern: فَعْلٌ, ayah: {ref: "16:90", text: إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ, en: "indeed Allah commands justice and doing good"}, note: "A just person: عَادِلٌ (اسْمُ فَاعِلٍ)."}

root_families:
  - root: ولد
    words: [[وَلَدَتْ, "she gave birth"], [تَلِدُ, "she gives birth"], [وَلَدٌ, "child"], [أَوْلَادٌ, "children"], [مَوْلُودٌ, "newborn"]]
  - root: ظلم
    words: [[ظَلَمَ, "he wronged"], [ظَالِمٌ, "wrongdoer"], [مَظْلُومٌ, "wronged"], [ظُلْمٌ, "injustice"], [ظُلْمَةٌ, "darkness"]]

grammar:
  title_ar: اِسْمُ الْفَاعِلِ وَاسْمُ الْمَفْعُولِ
  title_en: "The doer and the done-to: فَاعِلٌ and مَفْعُولٌ"
  body: >-
    From almost every three-letter verb you can make two nouns. اسْمُ الْفَاعِلِ (the doer's noun), on the pattern فَاعِلٌ, is the one who does the action:
    ظَلَمَ, he wronged; ظَالِمٌ, a wrongdoer. عَقَلَ, he understood; عَاقِلٌ, a sensible person. عَدَلَ, he was just; عَادِلٌ, just.
    اسْمُ الْمَفْعُولِ (the done-to noun), on the pattern مَفْعُولٌ, is the one the action is done to: ظَلَمَ, مَظْلُومٌ, wronged. سَرَّ, he made happy;
    مَسْرُورٌ, pleased. وَلَدَتْ, she gave birth; مَوْلُودٌ, newborn. When the last root letter is ي, the فَاعِلٌ loses it under tanwin
    when it is مَرْفُوعٌ or مَجْرُورٌ: قَضَى gives قَاضٍ, and with ال the ي returns: الْقَاضِي. When it is مَنْصُوبٌ the ي stays: رَأَيْتُ قَاضِيًا.
  examples:
    - [أَنَا رَجُلٌ مَظْلُومٌ, "I am a man who has been wronged."]
    - [فَالْقَاضِي الْعَادِلُ يَرُدُّ كُلَّ حَقٍّ إِلَى صَاحِبِهِ, "A just judge returns every right to its owner."]
    - [وَيَنقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا, "and he will return to his people happy (Quran 84:9)"]

tip:
  title: "Reading without vowels: مفعول or مفعل?"
  body: >-
    Two patterns both start with م. If you see a و just before the last letter, it is the مَفْعُولٌ pattern, a thing done to:
    مظلوم, مسرور, مولود, مكتوب. If there is no و, it is usually the place pattern مَفْعَلٌ or مَفْعِلٌ from booklet 1: مجلس, مسجد,
    مطبخ, ملعب. So مجلس is majlis, a place for sitting, and مولود is mawlūd, someone born. The letter و tells you before any vowel does.

reread: Read the unvowelled version above again. Then find every word on the pattern فاعل or مفعول and say which verb it comes from.
