# Booklet 3, story 1. Quran strand. Grammar ceiling: Madinah Book 2.
id: b3-01
booklet: 3
number: 1
strand: quran
title_ar: مُوسَى وَالْخَضِرُ
title_en: Musa and al-Khidr
madinah: "Book 2 (negation with لَمْ and the jussive; the dual in verbs and nouns)"
source: "Quran 18:60 to 82, in order. Details outside the ayat follow Sahih al-Bukhari 122, 3401 and 4725 and Sahih Muslim 2380: Musa's answer and Allah's blame, the fish in a basket, Yusha' ibn Nun, the fish stirring in the basket and the young man forgetting to tell Musa (Bukhari 4725), the crew carrying them without a fare, the bird at the edge of the ship, the plank pulled out, 'the first was forgetfulness', the boy playing with other boys, the wall set straight by hand, Musa's words about the village, the king passing the damaged boat by and its owners mending it with a piece of wood (Muslim 2380), the name al-Khidr, and the Prophet's ﷺ closing words. 'Every sound boat' (English only; the Arabic follows the mushaf, وَرَاءَهُمْ مَلِكٌ يَأْخُذُ كُلَّ سَفِينَةٍ غَصْبًا) is Ibn Abbas's reading in Bukhari 3401 and the meaning Ibn Kathir, al-Baghawi and al-Tabari give on 18:79. 'The boy was a disbeliever' is in the Prophet's ﷺ words in Muslim 2380 (طُبِعَ يَوْمَ طُبِعَ كَافِرًا), in Ibn Abbas's reading in Bukhari 3401, and in Ibn Kathir, al-Baghawi, al-Tabari and al-Qurtubi on 18:80."

