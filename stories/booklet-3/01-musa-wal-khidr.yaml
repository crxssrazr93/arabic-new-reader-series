grammar:
  title_ar: النَّفْيُ بِـلَمْ
  title_en: "Negation with لَمْ: a مُضَارِع with a past meaning"
  body: >-
    لَمْ comes before a مُضَارِعٌ (present verb) and turns it into a negative past: يَصْبِرُ, he is patient; لَمْ يَصْبِرْ, he was not patient.
    The verb after لَمْ is مَجْزُومٌ (jussive). A damma on the last letter becomes a sukun: يَتْعَبُ, لَمْ يَتْعَبْ. The ن of the dual and plural drops:
    يَقْبَلُونَ, لَمْ يَقْبَلُوا. A doubled verb takes a fatha: لَمْ يَرُدَّ. And when the last letter goes silent, a long vowel before it
    shortens: تَسْتَطِيعُ becomes لَمْ تَسْتَطِعْ, تُحِيطُ becomes لَمْ تُحِطْ, يَكُونُ becomes لَمْ يَكُنْ.
  examples:
    - [وَلَمْ يَرُدَّ الْعِلْمَ إِلَى اللَّهِ, "And he did not refer the knowledge back to Allah."]
    - [فَلَمْ يَقْبَلْ أَهْلُ الْقَرْيَةِ أَنْ يَكُونَا ضَيْفَيْنِ عِنْدَهُمْ, "The people of the village would not take them in as guests."]
    - [وَكَيْفَ تَصْبِرُ عَلَىٰ مَا لَمْ تُحِطْ بِهِ خُبْرًا, "And how can you be patient about what you have no full knowledge of? (18:68)"]

tip:
  title: "Reading without vowels: the alif of two"
  body: >-
    In this story many verbs end in ا: بلغا, ناما, انطلقا, لقيا, أتيا, رأيا, وجدا. On a فِعْلٌ مَاضٍ (past verb) this alif means "the two of them":
    balaghā, they both reached. Do not read it as the alif of tanwin fath, which only sits on nouns (غلاما, طعاما). The مُضَارِع
    of two ends in ان: يمشيان, يطلبانه. A noun of two ends in ان or ين: البحرين, ضيفين, يتيمين, مؤمنين (but مؤمنين can also be a plural; the sentence tells you). Ask yourself: is this a verb or a noun?

reread: Read the unvowelled version above again. Then recite Surat al-Kahf 18:60 to 82 and find the place of each event in it.
