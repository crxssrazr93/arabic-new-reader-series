grammar:
  title_ar: الْحَالُ
  title_en: "The hal: how someone was when they did something"
  body: >-
    The حَالٌ (state) is a مَنْصُوبٌ (in the nasb) word that tells the state of someone at the moment of the action. It answers the question كَيْفَ, how?
    رَجَعَتِ الْأَرْنَبُ فَرِحَةً: how did she come back? Happy. The حَالٌ is usually indefinite, and it describes a definite noun in the
    sentence (here الْأَرْنَبُ), agreeing with it in gender and number: قَامَ الْأَسَدُ غَاضِبًا, اِنْطَلَقَتِ الْأَرْنَبُ مُتَبَاطِئَةً,
    وَتَتْرُكُ الْبَاقِينَ آمِنِينَ. It is often an اسْمُ فَاعِلٍ (active participle). A whole sentence with وَ can also be a حَالٌ:
    قَالَتْ وَهِيَ تَرْتَجِفُ, she said, while she was trembling.
  examples:
    - [وَقَامَ مِنْ مَكَانِهِ يَنْظُرُ إِلَى الطَّرِيقِ غَاضِبًا, "He got up from his place, looking down the path in a rage."]
    - [فَجِئْتُ إِلَيْكَ مُسْرِعَةً, "So I came to you in a hurry."]
    - [فَقَالَتِ الْأَرْنَبُ وَهِيَ تَرْتَجِفُ, "The hare said, trembling. (a sentence as hal)"]

tip:
  title: "Reading without vowels: the hal still shows"
  body: >-
    Without vowels, the حَالٌ is still easy to spot. A masculine حَالٌ keeps its tanwin alif on the page (غاضبا), and a plural one its ين (آمنين).
    After a sentence that is already complete (قام الأسد من مكانه), an extra indefinite word ending in ا or ة, often on the فاعل or
    مفعل pattern, is the حَالٌ: غاضبا, فرحة, مسرعة, متباطئة. A feminine حَالٌ shows no alif, so the sentence must tell you: read it with fatha and tanwin, fariḥatan. If the word has ال
    (الأسد القوي), it is not a حَالٌ but a نَعْتٌ (describing word). Two look-alikes are not a حَالٌ: a مَصْدَرٌ of the same verb (غضب غضبا شديدا), and the word after كان, which is its خَبَرٌ (جائعا in كان جائعا). Ask كيف? about the doer.

reread: Read the unvowelled version above again. Then find every hal in the story and say who it describes.
