# Booklet 4, story 3. Tale strand, told in class by Ustadh Hamid. Grammar ceiling: Madinah Book 3.
id: b4-03
booklet: 4
number: 3
strand: tale
title_ar: الْأَسَدُ وَالْأَرْنَبُ
title_en: The Lion and the Hare
madinah: "Book 3 (the hal: how someone was when they did something)"
source: "Kalila wa Dimna (Ibn al-Muqaffa'), Bab al-Asad wa-th-Thawr: the fable Dimna tells of the lion and the hare (lexicon/sources/kalila/asad-wal-thawr-default.wiki, Arabic Wikisource), retold in order: the land rich in water and pasture, the beasts' fear, their offer of one animal a day at his midday meal, the lot falling on the hare, her slow walk past his mealtime, her story of another lion who took the hare she was bringing, the well of clear water, the lion seeing his own image and the hare's, leaping in and drowning, and the hare telling the beasts. The beasts' talk of fleeing, the step-by-step walk, the echo and the class frame are our own. In the original the beasts and the hare are feminine, and so they are here. The lessons, and the warning that the hare's lie is not ours to copy, are Ustadh Hamid's."

