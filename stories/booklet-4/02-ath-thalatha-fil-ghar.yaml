# Booklet 4, story 2. Hadith strand, read in class by Ustadh Hamid. Grammar ceiling: Madinah Book 3.
id: b4-02
booklet: 4
number: 2
strand: hadith
title_ar: الثَّلَاثَةُ فِي الْغَارِ
title_en: The Three Men in the Cave
madinah: "Book 3 (exception with إِلَّا and غَيْرُ)"
source: "Sahih al-Bukhari 2272 (also Muslim 2743), in order: the rock that closed the cave, 'nothing will save you from this rock except calling on Allah by your good deeds', the parents and the evening milk, the cousin and the hundred and twenty dinars, the worker's wage that grew into camels, cattle, sheep and slaves, and the rock opening a little each time. The rain and the children crying at his feet are from al-Bukhari 2215 and 5974, and 'from hunger' from al-Bukhari 3465; 'fear Allah' is the cousin's wording in al-Bukhari 2215 and 5974, and the rock opening wider the second time follows al-Bukhari 2215 (two thirds). The size of the rock and that no one could hear them (sentences 10 and 11) are the Ustadh's explanation, not the hadith. The cousin episode is told briefly: 'a forbidden thing' stands for the hadith's plain wording, and 'except by its right' is explained as marriage, as the commentators do. The class frame and the students' answers are our own; the teacher's line on sincerity is the first half of a hadith in Sunan an-Nasa'i 3140 (graded hasan by Darussalam on sunnah.com; the second half, وَابْتُغِيَ بِهِ وَجْهُهُ, is left out), given as the words of the Prophet ﷺ."

