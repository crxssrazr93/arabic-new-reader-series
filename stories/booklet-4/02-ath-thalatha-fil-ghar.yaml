grammar:
  title_ar: الِاسْتِثْنَاءُ بِـإِلَّا وَغَيْرٍ
  title_en: "Exception with إِلَّا and غَيْرُ: all except one, nothing except this"
  body: >-
    إِلَّا takes one thing out of what the sentence says. الْمُسْتَثْنَى is the thing taken out, and الْمُسْتَثْنَى مِنْهُ is what it is taken from.
    When the sentence is complete and positive (تَامٌّ مُثْبَتٌ), the word after إِلَّا is مَنْصُوبٌ: أَعْطَيْتُهُمْ أُجُورَهُمْ إِلَّا رَجُلًا.
    When the sentence is negative and the thing taken out is missing from it (مُفَرَّغٌ), the word after إِلَّا takes the case the sentence
    needs, as if لَا and إِلَّا were not there: لَمْ يُنْجِهِمْ إِلَّا دُعَاؤُهُمْ (the فَاعِلٌ, so مَرْفُوعٌ). This
    pattern, لَا ... إِلَّا, means only: nothing saved them but their dua. غَيْرُ does the same job as a noun. It takes the case the word
    after إِلَّا would take, and the word after it is مَجْرُورٌ, as مُضَافٌ إِلَيْهِ: غَيْرَ رَجُلٍ وَاحِدٍ.
  examples:
    - [إِنَّهُ لَا يُنْجِيكُمْ مِنْ هٰذِهِ الصَّخْرَةِ إِلَّا أَنْ تَدْعُوا اللَّهَ, "Nothing will save you from this rock except calling on Allah."]
    - [فَلَمْ أَرْجِعْ إِلَيْهِمَا إِلَّا بَعْدَ أَنْ نَامَا, "I did not come back to them until after they had slept."]
    - [فَأَعْطَيْتُهُمْ أُجُورَهُمْ كُلَّهَا غَيْرَ رَجُلٍ وَاحِدٍ, "I gave them all their wages, except one man."]

tip:
  title: "Reading without vowels: the pattern انفعل"
  body: >-
    A verb that starts with ان before three root letters is almost always بَابُ الِانْفِعَالِ, اِنْفَعَلَ: انحدرت, انفرجت, انصرفت, and انطلق from
    the story of Musa عَلَيْهِ السَّلَامُ. The pattern gives you every vowel: inḥadarat, infarajat, inṣaraftu. This bab has no object: it tells what happened
    to the thing itself. The rock انفرجت, moved apart; no one moved it but Allah. The present is ينفعل: ينحدر, ينفرج. But if the next letter is ت,
    the ن is a root letter and the verb is بَابُ الِافْتِعَالِ: اِنْتَظَرَ, whose present أَنْتَظِرُ you read in this story. Compare امتنعت,
    with a ت after the first root letter: that is also بَابُ الِافْتِعَالِ, اِفْتَعَلَ.

