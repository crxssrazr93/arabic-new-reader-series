grammar:
  title_ar: الْفِعْلُ الْمَبْنِيُّ لِلْمَجْهُولِ
  title_en: "The passive: when the doer is not named"
  body: >-
    When we do not name the doer, or do not need to, the verb becomes passive (مَبْنِيٌّ لِلْمَجْهُولِ) and the thing done to becomes its نَائِبُ
    الْفَاعِلِ (stand-in for the doer), مَرْفُوعٌ (in the raf'): دَفَنَ الصَّحَابَةُ النَّبِيَّ ﷺ, the Companions buried the Prophet ﷺ; دُفِنَ النَّبِيُّ ﷺ, the Prophet ﷺ was buried.
    In the فِعْلٌ مَاضٍ (past verb), the first letter takes a damma and the letter before the last a kasra: دَفَنَ, دُفِنَ; بَنَى, بُنِيَ; قَتَلُوا, قُتِلُوا.
    A verb of بَابُ التَّفْعِيلِ keeps its shadda: أَسَّسَ, أُسِّسَ; وَسَّعَ, وُسِّعَ. In the فِعْلٌ مُضَارِعٌ (present verb), the first letter takes a damma and the letter before the
    last a fatha: يُكْتَبُ, it is written; يُسَمَّى, it is called; يُقَالُ, it is said.
  examples:
    - [وَقَدْ دُفِنَ النَّبِيُّ ﷺ فِي حُجْرَةِ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا, "The Prophet ﷺ was buried in the room of Aisha (may Allah be pleased with her)."]
    - [وَهُوَ أَوَّلُ مَسْجِدٍ بُنِيَ فِي الْإِسْلَامِ, "It was the first mosque built in Islam."]
    - [جَبَلًا صَغِيرًا يُسَمَّى جَبَلَ الرُّمَاةِ, "a small hill called the Hill of the Archers"]

tip:
  title: "Reading without vowels: is it passive?"
  body: >-
    Without vowels, دفن can be دَفَنَ (he buried) or دُفِنَ (he was buried), and بني can be بَنَى or بُنِيَ. In this booklet passive verbs
    keep their marks, but in booklet 5 they will not. Ask: who did it? If the sentence names no doer and the word after the verb is the
    thing done to, read the verb as passive: ودفن الشهداء هناك can only mean the martyrs were buried. If the verb carries its doer, as in حين بنوه (when they
    built it), it is active. A verb of بَابُ التَّفْعِيلِ with shadda on its middle letter (وسع المسجد) is passive too only if no doer was named before it and the noun after it is what was done to.

reread: Read the unvowelled version above again. Then underline every passive verb and say what was done and to what.
