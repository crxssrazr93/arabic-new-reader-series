# Booklet 4, story 4. Modern strand (MSA). Grammar ceiling: Madinah Book 3.
id: b4-04
booklet: 4
number: 4
strand: modern
title_ar: الرِّحْلَةُ إِلَى الْمَدِينَةِ
title_en: The Journey to Madinah
madinah: "Book 3 (the passive: الْفِعْلُ الْمَبْنِيُّ لِلْمَجْهُولِ)"
source: "Modern story. Facts follow sound sources: Hajar's running between as-Safa and al-Marwa (al-Bukhari 3364); the Prophet's mosque of mud brick, palm-branch roof and palm-trunk pillars, and the Prophet carrying stones with his Companions (al-Bukhari 428, 446); prayer in it better than a thousand elsewhere except al-Masjid al-Haram (al-Bukhari 1190); 'between my house and my minbar is a garden of the gardens of Paradise' (al-Bukhari 1196); his visits to Quba every Saturday, walking and riding, and his two rak'as there (al-Bukhari 1193, 1194); the fifty archers at Uhud, told not to leave their place, and seventy Muslims killed (al-Bukhari 3039; the hill is named by the seerah, not by al-Bukhari); Hamza killed at Uhud (al-Bukhari 4072); the martyrs buried where they fell (Abu Dawud 3165, sahih); the Prophet ﷺ buried in Aisha's house, with Abu Bakr and Umar beside him (al-Bukhari 1389, 1392); 'Uhud is a mountain that loves us and we love it' (Muslim 1393; al-Bukhari 4083 has 'This is a mountain...'). Scholars differ over whether 9:108 is about Quba or the Prophet's mosque; the story says only that many scholars hold it is Quba."

