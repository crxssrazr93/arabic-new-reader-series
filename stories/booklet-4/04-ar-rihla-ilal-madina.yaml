dictionary:
  - {ar: عُمْرَةٌ, en: umrah (the lesser pilgrimage), pos: [اسم, noun], root: عمر, pattern: فُعْلَةٌ, ayah: {ref: "2:196", text: وَأَتِمُّوا الْحَجَّ وَالْعُمْرَةَ لِلَّهِ, en: "and complete the Hajj and the umrah for Allah"}, note: "From the root of visiting a place and keeping it alive with people. It can be done at any time of the year; Hajj only on its days in Dhul Hijja."}
  - {ar: إِحْرَامٌ, en: "ihram (the state, and clothes, of the pilgrim)", pos: [مصدر, verbal noun], root: حرم, pattern: إِفْعَالٌ, ayah: {ref: "5:1", text: وَأَنتُمْ حُرُمٌ, en: "while you are in the state of ihram"}, note: "From أَحْرَمَ (بَابُ الْإِفْعَالِ): he entered a state in which some lawful things become حَرَامٌ for him for a time."}
  - {ar: مِيقَاتٌ, en: appointed place or time; miqat, pos: [اسم, noun], root: وقت, pattern: مِفْعَالٌ, plural: مَوَاقِيتُ, ayah: {ref: "7:143", text: وَلَمَّا جَاءَ مُوسَىٰ لِمِيقَاتِنَا, en: "and when Musa came at Our appointed time"}, note: "The و of وقت becomes ي after the kasra. For the pilgrim, the مِيقَاتُ is the place where ihram begins; planes from Sri Lanka pass it before Jeddah."}
  - {ar: طَافَ, en: he went round, pos: [فعل ماض, past verb], present: يَطُوفُ, bab: بَابُ نَصَرَ, root: طوف, pattern: فَعَلَ, ayah: {ref: "22:29", text: وَلْيَطَّوَّفُوا بِالْبَيْتِ الْعَتِيقِ, en: "and let them go round the Ancient House"}, note: "Going round the Ka'ba seven times is الطَّوَافُ."}
  - {ar: كَعْبَةٌ, en: the Ka'ba, pos: [اسم, noun], root: كعب, pattern: فَعْلَةٌ, ayah: {ref: "5:97", text: جَعَلَ اللَّهُ الْكَعْبَةَ الْبَيْتَ الْحَرَامَ, en: "Allah made the Ka'ba, the Sacred House"}, note: "The name comes from its cube shape. The Quran also calls it الْبَيْتُ, the House."}
  - {ar: سَعَى, en: he went quickly; he strove; he walked between Safa and Marwa, pos: [فعل ماض, past verb], present: يَسْعَى, bab: بَابُ فَتَحَ, root: سعي, pattern: فَعَلَ, ayah: {ref: "53:39", text: وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ, en: "and that man has only what he strives for"}, note: "Past plural: سَعَوْا. The walk between as-Safa and al-Marwa is السَّعْيُ."}
  - {ar: حَلَقَ, en: he shaved, pos: [فعل ماض, past verb], present: يَحْلِقُ, bab: بَابُ ضَرَبَ, root: حلق, pattern: فَعَلَ, ayah: {ref: "48:27", text: مُحَلِّقِينَ رُءُوسَكُمْ وَمُقَصِّرِينَ, en: "with your heads shaved or your hair cut short"}, note: "Do not confuse it with خَلَقَ, he created: only the dot is different. قَصَّرَ (بَابُ التَّفْعِيلِ): he cut the hair short."}
  - {ar: دَفَنَ, en: he buried, pos: [فعل ماض, past verb], present: يَدْفِنُ, bab: بَابُ ضَرَبَ, root: دفن, pattern: فَعَلَ, note: "Passive: دُفِنَ, he was buried. Not in the Quran, which says أَقْبَرَهُ (80:21)."}
  - {ar: قَبْرٌ, en: grave, pos: [اسم, noun], root: قبر, pattern: فَعْلٌ, plural: قُبُورٌ, ayah: {ref: "80:21", text: ثُمَّ أَمَاتَهُ فَأَقْبَرَهُ, en: "then He causes him to die and puts him in a grave"}, note: "A graveyard is مَقْبَرَةٌ, the place pattern: مَقَابِرُ in 102:2."}
  - {ar: حُجْرَةٌ, en: room; private apartment, pos: [اسم, noun], root: حجر, pattern: فُعْلَةٌ, plural: حُجُرَاتٌ, ayah: {ref: "49:4", text: إِنَّ الَّذِينَ يُنَادُونَكَ مِن وَرَاءِ الْحُجُرَاتِ, en: "those who call you from behind the private rooms"}, note: "The rooms of the wives of the Prophet ﷺ beside the mosque. Surat al-Hujurat is named after them."}
  - {ar: رَوْضَةٌ, en: garden; meadow, pos: [اسم, noun], root: روض, pattern: فَعْلَةٌ, plural: رِيَاضٌ, ayah: {ref: "30:15", text: فَهُمْ فِي رَوْضَةٍ يُحْبَرُونَ, en: "they will be delighted in a garden"}, note: "In the mosque of the Prophet ﷺ, الرَّوْضَةُ is the area between his house and his minbar. Riyadh, the city, is the plural: gardens."}
  - {ar: مِنْبَرٌ, en: minbar; pulpit, pos: [اسم, noun], root: نبر, pattern: مِفْعَلٌ, plural: مَنَابِرُ, note: "The raised steps from which the imam gives the khutba. مِفْعَلٌ is a pattern for tools and instruments, and so is its sister مِفْعَالٌ: مِنْقَارٌ, a beak. Not in the Quran."}
  - {ar: أَسَّسَ, en: he founded; he laid the foundation of, pos: [فعل ماض, past verb], present: يُؤَسِّسُ, bab: بَابُ التَّفْعِيلِ, root: أسس, pattern: فَعَّلَ, ayah: {ref: "9:108", text: لَّمَسْجِدٌ أُسِّسَ عَلَى التَّقْوَىٰ, en: "a mosque founded on taqwa"}, note: "Added letters, from أَسَاسٌ, a foundation. In 9:108 it is passive: أُسِّسَ, it was founded."}
  - {ar: خُشُوعٌ, en: humility; stillness in prayer, pos: [مصدر, verbal noun], root: خشع, pattern: فُعُولٌ, ayah: {ref: "23:2", text: الَّذِينَ هُمْ فِي صَلَاتِهِمْ خَاشِعُونَ, en: "those who are humble in their prayer"}, note: "From خَشَعَ يَخْشَعُ. The heart and body both become still and humble before Allah."}
  - {ar: شَهِيدٌ, en: martyr; witness, pos: [صفة مشبهة, "adjective; also a noun: martyr"], root: شهد, pattern: فَعِيلٌ, plural: شُهَدَاءُ, ayah: {ref: "3:140", text: وَيَتَّخِذَ مِنكُمْ شُهَدَاءَ, en: "and that He may take martyrs from among you"}, note: "Ibn Kathir explains that this part of Surat Al Imran speaks of the Battle of Uhud. اُسْتُشْهِدَ (passive, بَابُ الِاسْتِفْعَالِ): he was martyred."}
  - {ar: مَعْرَكَةٌ, en: battle, pos: [اسم مكان, noun of place], root: عرك, pattern: مَفْعَلَةٌ, plural: مَعَارِكُ, register: modern, note: "Literally the place where fighters struggle. Classical writers usually say غَزْوَةُ أُحُدٍ for the battles of the Prophet ﷺ."}
  - {ar: رَامٍ, en: archer; one who shoots, pos: [اسم فاعل, active participle], root: رمي, pattern: فَاعِلٌ, plural: رُمَاةٌ, ayah: {ref: "8:17", text: وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَـٰكِنَّ اللَّهَ رَمَىٰ, en: "and you did not throw when you threw, but Allah threw"}, note: "From رَمَى يَرْمِي, he threw or shot. Like قَاضٍ: the plural رُمَاةٌ is on the فُعَلَةٌ pattern, like قُضَاةٌ."}

