# Booklet 4, story 1. Quran strand. Grammar ceiling: Madinah Book 2 end and Book 3.
id: b4-01
booklet: 4
number: 1
strand: quran
title_ar: أَصْحَابُ الْكَهْفِ
title_en: The People of the Cave
madinah: "Book 2 end (kana and its sisters: كَانَ, صَارَ, أَصْبَحَ, ظَلَّ, لَيْسَ, مَا زَالَ)"
source: "Quran 18:9 to 26, in order: first the short summary of 18:9 to 12, then the full account of 18:13 to 26. 'Their story is not more wondrous than the creation of the heavens and the earth' (18:9), 'which food is purest: lawful and good' (18:19), 'raising them is a sign of the raising on the Day of Resurrection' (18:21) and the dog sharing their sleep by the blessing of their company (18:18) follow Ibn Kathir's explanation. 'He covered their ears: they slept so deeply that no sound woke them' (18:11) follows al-Qurtubi (from Ibn Abbas) and al-Baghawi; Ibn Kathir says only that Allah cast sleep on them. No names, no number for the young men, no name for the dog and no account of the trip to the city are given, because the ayat do not give them. The closing line about seeking shelter with Allah echoes Sahih Muslim 2176."

