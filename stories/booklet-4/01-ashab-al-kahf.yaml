dictionary:
  - {ar: كَهْفٌ, en: cave, pos: [اسم, noun], root: كهف, pattern: فَعْلٌ, plural: كُهُوفٌ, ayah: {ref: "18:10", text: إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ, en: "when the young men took shelter in the cave"}, note: "A large cave in a mountain. غَارٌ, which you met in the Hijra story, is usually a smaller cave."}
  - {ar: أَوَى, en: he took shelter; he went to for refuge, pos: [فعل ماض, past verb], present: يَأْوِي, bab: بَابُ ضَرَبَ, root: أوي, pattern: فَعَلَ, ayah: {ref: "18:16", text: فَأْوُوا إِلَى الْكَهْفِ, en: "so take shelter in the cave"}, note: "Past plural: أَوَوْا. آوَى يُؤْوِي (بَابُ الْإِفْعَالِ): he gave someone shelter. Allah's words about the Prophet's ﷺ early years: أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ (93:6)."}
  - {ar: قَلْبٌ, en: heart, pos: [اسم, noun], root: قلب, pattern: فَعْلٌ, plural: قُلُوبٌ, ayah: {ref: "26:89", text: إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ, en: "except whoever comes to Allah with a sound heart"}, note: "The root means to turn over. The heart is the thing that turns: يُقَلِّبُهُمْ, He turns them over."}
  - {ar: رَبَطَ, en: he tied; he made firm, pos: [فعل ماض, past verb], present: يَرْبِطُ, bab: بَابُ ضَرَبَ, root: ربط, pattern: فَعَلَ, ayah: {ref: "18:14", text: وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ, en: "and We made their hearts firm"}, note: "To tie a rope or an animal. رَبَطَ عَلَى قَلْبِهِ: He made his heart strong and steady."}
  - {ar: طَلَعَ, en: it rose (the sun or moon), pos: [فعل ماض, past verb], present: يَطْلُعُ, bab: بَابُ نَصَرَ, root: طلع, pattern: فَعَلَ, ayah: {ref: "18:17", text: وَتَرَى الشَّمْسَ إِذَا طَلَعَت, en: "and you would see the sun when it rose"}, note: "Its opposite is غَرَبَ. The rising of the dawn: مَطْلَعُ الْفَجْرِ (97:5)."}
  - {ar: يَمِينٌ, en: the right (side); right hand; oath, pos: [اسم, noun], root: يمن, pattern: فَعِيلٌ, ayah: {ref: "18:18", text: وَنُقَلِّبُهُمْ ذَاتَ الْيَمِينِ وَذَاتَ الشِّمَالِ, en: "and We turn them over to the right and to the left"}, note: "ذَاتَ الْيَمِينِ: toward the right. In fiqh, يَمِينٌ is also an oath."}
  - {ar: شِمَالٌ, en: the left (side); left hand, pos: [اسم, noun], root: شمل, pattern: فِعَالٌ, ayah: {ref: "69:25", text: وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِشِمَالِهِ, en: "and as for the one given his record in his left hand"}, register: both, note: "Classical: the left side. In modern Arabic شَمَالٌ (with fatha) is the north; the left hand is usually الْيَسَارُ."}
  - {ar: يَقِظٌ, en: awake, pos: [صفة مشبهة, adjective], root: يقظ, pattern: فَعِلٌ, plural: أَيْقَاظٌ, ayah: {ref: "18:18", text: وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ, en: "and you would think them awake, though they were asleep"}, note: "Same root as أَيْقَظَ, he woke someone up, which you met in Ramadan at Home."}
  - {ar: رَاقِدٌ, en: lying asleep, pos: [اسم فاعل, active participle], root: رقد, pattern: فَاعِلٌ, plural: رُقُودٌ, ayah: {ref: "36:52", text: مَن بَعَثَنَا مِن مَّرْقَدِنَا, en: "who has raised us from our sleeping place?"}, note: "From رَقَدَ يَرْقُدُ, he lay asleep. مَرْقَدٌ is a place of sleep, on the مَفْعَلٌ place pattern."}
  - {ar: كَلْبٌ, en: dog, pos: [اسم, noun], root: كلب, pattern: فَعْلٌ, plural: كِلَابٌ, ayah: {ref: "18:18", text: وَكَلْبُهُم بَاسِطٌ ذِرَاعَيْهِ بِالْوَصِيدِ, en: "and their dog stretching out its forelegs at the entrance"}, note: "The Quran does not give the dog a name, and neither does this story."}
  - {ar: بَعَثَ, en: he raised up; he sent, pos: [فعل ماض, past verb], present: يَبْعَثُ, bab: بَابُ فَتَحَ, root: بعث, pattern: فَعَلَ, ayah: {ref: "18:12", text: ثُمَّ بَعَثْنَاهُمْ, en: "then We raised them up"}, note: "Raising the dead on the Last Day is الْبَعْثُ. In 18:19 the same verb means to send: فَابْعَثُوا أَحَدَكُمْ, send one of you."}
  - {ar: أَصْبَحَ, en: he became; it became morning, pos: [فعل ماض, past verb], present: يُصْبِحُ, bab: بَابُ الْإِفْعَالِ, root: صبح, pattern: أَفْعَلَ, ayah: {ref: "18:42", text: فَأَصْبَحَ يُقَلِّبُ كَفَّيْهِ, en: "and he began wringing his hands"}, note: "A sister of كَانَ: أَصْبَحُوا أَيْقَاظًا, they became awake. Literally, to be so in the morning (صَبَاحٌ)."}
  - {ar: لَبِثَ, en: he stayed; he remained (for a time), pos: [فعل ماض, past verb], present: يَلْبَثُ, bab: بَابُ سَمِعَ, root: لبث, pattern: فَعِلَ, ayah: {ref: "18:19", text: قَالَ قَائِلٌ مِّنْهُمْ كَمْ لَبِثْتُمْ, en: "one of them said: how long have you stayed?"}, note: "Used for how long someone stays, so it often comes with كَمْ, how long."}
  - {ar: وَرِقٌ, en: silver coins; silver, pos: [اسم, noun], root: ورق, pattern: فَعِلٌ, ayah: {ref: "18:19", text: فَابْعَثُوا أَحَدَكُم بِوَرِقِكُمْ هَـٰذِهِ إِلَى الْمَدِينَةِ, en: "so send one of you with this silver money of yours to the city"}, note: "Do not confuse it with وَرَقٌ, leaves or paper (وَرَقَةٌ, one leaf: 6:59). Without vowels both are ورق, so this word keeps its marks."}
  - {ar: تَلَطَّفَ, en: he was careful and gentle, pos: [فعل ماض, past verb], present: يَتَلَطَّفُ, bab: بَابُ التَّفَعُّلِ, root: لطف, pattern: تَفَعَّلَ, ayah: {ref: "18:19", text: وَلْيَتَلَطَّفْ وَلَا يُشْعِرَنَّ بِكُمْ أَحَدًا, en: "and let him be careful and not let anyone know about you"}, note: "From لَطُفَ, he was gentle. Allah's name اللَّطِيفُ, the Subtle, the Gentle, is from the same root."}
  - {ar: بَنَى, en: he built, pos: [فعل ماض, past verb], present: يَبْنِي, bab: بَابُ ضَرَبَ, root: بني, pattern: فَعَلَ, ayah: {ref: "91:5", text: وَالسَّمَاءِ وَمَا بَنَاهَا, en: "by the sky and the One who built it"}, note: "Command: اِبْنِ, plural اِبْنُوا. A building: بُنْيَانٌ or بِنَاءٌ."}
  - {ar: غَيْبٌ, en: the unseen, pos: [مصدر, verbal noun], root: غيب, pattern: فَعْلٌ, ayah: {ref: "2:3", text: الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ, en: "those who believe in the unseen"}, note: "From غَابَ يَغِيبُ, it was absent. Everything hidden from our senses: the angels, the Last Day, and what is still to come."}
  - {ar: عَدَدٌ, en: number; count, pos: [اسم, noun], root: عدد, pattern: فَعَلٌ, plural: أَعْدَادٌ, ayah: {ref: "18:11", text: فِي الْكَهْفِ سِنِينَ عَدَدًا, en: "in the cave for a number of years"}, note: "From عَدَّ يَعُدُّ, he counted. عِدَّةٌ (18:22) is also a number, the count of something."}

root_families:
