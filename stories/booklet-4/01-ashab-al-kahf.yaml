grammar:
  title_ar: كَانَ وَأَخَوَاتُهَا
  title_en: "Kana and its sisters: the khabar in the nasb"
  body: >-
    كَانَ comes before a nominal sentence. اسْمُ كَانَ (its ism) stays مَرْفُوعٌ, and خَبَرُ كَانَ (its khabar) becomes مَنْصُوبٌ:
    الْكَلْبُ بَاسِطٌ, the dog is stretching out; كَانَ الْكَلْبُ بَاسِطًا, the dog was stretching out. Several verbs work the same way and are
    called its sisters: صَارَ (he became), أَصْبَحَ (he became; was in the morning), ظَلَّ (he stayed, kept on), لَيْسَ (he is not) and
    مَا زَالَ (he is still). The khabar may be a word (أَيْقَاظًا), a sound plural in ـِينَ (نَائِمِينَ), a diptote with a single fatha
    (أَقْوِيَاءَ, أَعْجَبَ), or a whole phrase (يَعِيشُونَ فِي مَدِينَةٍ; فِي الْمَدِينَةِ).
  examples:
    - [وَكَانَ بَاسِطًا ذِرَاعَيْهِ عِنْدَ بَابِ الْكَهْفِ, "And it lay stretching out its forelegs at the entrance of the cave. (kana)"]
    - [فَصَارُوا أَقْوِيَاءَ لَا يَخَافُونَ أَحَدًا إِلَّا اللَّهَ, "So they became strong, fearing no one but Allah. (sara)"]
    - [فَأَصْبَحُوا أَيْقَاظًا, "And they became awake. (asbaha)"]
    - [وَظَلُّوا نَائِمِينَ سِنِينَ كَثِيرَةً, "And they stayed asleep for many years. (zalla)"]

tip:
  title: "Reading without vowels: why some words keep their marks"
  body: >-
    From now on most words are bare, but some keep their marks because the letters alone could be read two ways. ورق is وَرِقٌ (silver coins)
    or وَرَقٌ (leaves). ظلوا is ظَلُّوا (they stayed), from the same letters as ظِلٌّ (shade). وعد is وَعْدٌ (a promise) or وَعَدَ (he promised).
    هدى is هُدًى (guidance) or هَدَى (he guided). أعجب and أظلم can be the comparatives أَعْجَبُ, أَظْلَمُ (more wondrous, more unjust) or
    verbs of بَابُ الْإِفْعَالِ (أَعْجَبَ، أَظْلَمَ). When you meet a bare word, ask the same question: noun or verb? Then let the sentence decide.

reread: Read the unvowelled version above again. Then recite Surat al-Kahf 18:9 to 26 and find where each part of the story comes in it.
