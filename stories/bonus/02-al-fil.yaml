grammar:
  title_ar: كَافُ التَّشْبِيهِ
  title_en: "كَ: like"
  body: >-
    The one letter كَ, joined to the front of a noun, means "like". The noun after it is مَجْرُورٌ (it takes kasra), just as after بِ or لِ.
    So عَصْفٌ (straw) becomes كَعَصْفٍ, like straw. The Quran often paints a picture this way.
  examples:
    - [كَعَصْفٍ مَّأْكُولٍ, "like eaten-up straw (105:5)"]
    - [كَالْفَرَاشِ الْمَبْثُوثِ, "like scattered moths (101:4)"]
    - [كَالْجِبَالِ, "like the mountains (11:42)"]

tip:
  title: "Meaning note: أَبَابِيل and سِجِّيل"
  body: >-
    أَبَابِيل means groups coming one after another, flock after flock; it has no singular in normal use.
    سِجِّيل, as the tafsir scholars explain (Ibn Kathir, al-Tabari), is stone made of clay, very hard; al-Qurtubi adds that the clay was baked. Small stones,
    from small birds, were enough to destroy an army that came to tear down the Kaaba, in the year the Prophet ﷺ was born (as the tafsir books report).

