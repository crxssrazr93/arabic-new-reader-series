grammar:
  title_ar: الْمُثَنَّى فِي الْإِضَافَةِ
  title_en: "The dual loses its ن in idafa"
  body: >-
    The dual (الْمُثَنَّى, two of something) ends in انِ: يَدَانِ, two hands. When a dual is the first word of an إِضَافَةٌ (possession phrase), its ن drops:
    يَدَانِ before أَبِي لَهَبٍ becomes يَدَا أَبِي لَهَبٍ, the two hands of Abu Lahab. The same happens before an attached pronoun.
  examples:
    - [يَدَا أَبِي لَهَبٍ, "the two hands of Abu Lahab (from يَدَانِ)"]
    - [بَلْ يَدَاهُ مَبْسُوطَتَانِ, "rather, both His hands are spread open (5:64)"]
    - [يَدَانِ, "two hands (no idafa, ن stays)"]

tip:
  title: "Meaning note: the root لهب"
  body: >-
    Abu Lahab was a nickname, "father of flame", given for his bright, glowing face, as the tafsir books report. The surah turns his own name against him:
    he will burn in a Fire ذَاتَ لَهَبٍ, of flame. حَمَّالَةَ الْحَطَبِ (on the pattern فَعَّالَة, one who carries a lot)
    is explained by the tafsir scholars in more than one way: she carried thorns to throw in the Prophet's ﷺ path,
    or she carried slander about him, which is "firewood" for trouble; Ibn Kathir also explains that in the Fire she will carry firewood onto her husband. Note أَبِي, not أَبُو: it is the مُضَافٌ إِلَيْهِ, so it is مَجْرُورٌ with ي (الْأَسْمَاءُ الْخَمْسَةُ).

