grammar:
  title_ar: الِاسْمُ الْمَوْصُولُ
  title_en: "الَّذِي and الَّذِينَ: the one who, those who"
  body: >-
    الَّذِي (the one who, for one male) and الَّذِينَ (those who, for a male or mixed group) join a description to a noun.
    The words after them (the صلة) tell you who is meant. This surah builds its whole picture with them: first one man,
    الَّذِي, then a group, الَّذِينَ.
  examples:
    - [الَّذِي يُكَذِّبُ بِالدِّينِ, "the one who denies the Recompense"]
    - [الَّذِينَ هُمْ يُرَاءُونَ, "those who show off"]
    - [صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ, "the path of those You have blessed (1:7)"]

tip:
  title: "Meaning note: عَن صَلَاتِهِمْ, not فِي صَلَاتِهِمْ"
  body: >-
    The ayah says heedless عَن (about) their prayer, not فِي (in) their prayer. The tafsir scholars point out the
    difference: everyone makes small slips inside the prayer; the warning is for those careless about the prayer itself,
    delaying it past its time or neglecting it. الْمَاعُون is the small help people normally share (Ibn Kathir mentions
    lending a pot, a bucket or an axe, and also zakat).

