  - {ar: نَحَرَ, en: he sacrificed (a camel), pos: [فعل ماض, past verb], root: نحر, pattern: "فَعَلَ", present: يَنْحَرُ, bab: بَابُ فَتَحَ, note: "From نَحْرٌ, the upper chest, where a camel is sacrificed. The verb comes only here in the Quran. In the surah: اِنْحَرْ, sacrifice! (command)."}
  - {ar: شَانِئٌ, en: one who hates, pos: [اسم فاعل, active participle], root: شنأ, pattern: فَاعِلٌ, ayah: {ref: "5:2", text: وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ, en: "and do not let hatred of a people drive you"}, note: "Tanzil writes it شَانِئَكَ. In 5:2: شَنَآنُ, hatred."}
  - {ar: أَبْتَرُ, en: cut off; one with no lasting good or remembrance, pos: [صفة, adjective], root: بتر, pattern: أَفْعَلُ, note: "بَتَرَ is to cut off. Comes only here in the Quran. As Ibn Kathir reports, an enemy called the Prophet ﷺ by the name أَبْتَر when his son died; Allah turned the word back on them."}

grammar:
  title_ar: إِنَّ وَاسْمُهَا
  title_en: "إِنَّ: indeed"
  body: >-
    إِنَّ makes a sentence strong and certain ("indeed"). The noun after it, the اسْمُ إِنَّ, is مَنْصُوبٌ (fatha): شَانِئَكَ, not شَانِئُكَ.
    A pronoun can join on: إِنَّ with نَا becomes إِنَّا, indeed We. In ayah 3, هُوَ between the two parts adds
    "he and no one else": it is your hater who is cut off, not you.
  examples:
    - [إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ, "Indeed We have given you al-Kawthar"]
    - [إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ, "Indeed your hater, he is the one cut off"]
    - [إِنَّهُ كَانَ تَوَّابًا, "Indeed He is ever accepting of repentance (110:3)"]

tip:
  title: "Meaning note: the root كثر"
  body: >-
    كثر is about much and many: كَثِيرٌ, much; أَكْثَرُ, more, most; تَكَاثُرٌ, competing for more (102:1).
    The pattern فَوْعَل makes it very large: كَوْثَر, an abundance with no end. The surah answers the enemies' word
    أَبْتَر (cut off) with its opposite.

