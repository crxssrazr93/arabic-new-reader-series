dictionary:
  - {ar: عَاذَ, en: he sought refuge; he sought protection, pos: [فعل ماض, past verb], root: عوذ, pattern: "فَعَلَ", present: يَعُوذُ, bab: بَابُ نَصَرَ, ayah: {ref: "19:18", text: قَالَتْ إِنِّي أَعُوذُ بِالرَّحْمَـٰنِ مِنكَ, en: "she said: I seek refuge in the Most Merciful from you"}, note: "The middle و shows in the present and becomes ا in the past (أَجْوَفُ, hollow). The same word as in أَعُوذُ بِاللَّهِ."}
  - {ar: فَلَقٌ, en: daybreak; dawn, pos: [اسم, noun], root: فلق, pattern: فَعَلٌ, ayah: {ref: "6:96", text: فَالِقُ الْإِصْبَاحِ, en: "the One who splits open the dawn"}, note: "فَالِقٌ is the اسْمُ فَاعِلٍ (active participle) of فَلَقَ (بَابُ ضَرَبَ)."}
  - {ar: شَرٌّ, en: evil; harm, pos: [اسم, noun], root: شرر, pattern: فَعْلٌ, plural: شُرُورٌ, ayah: {ref: "99:8", text: وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ, en: "and whoever does an atom's weight of evil will see it"}, note: "Its opposite is خَيْرٌ, good."}
  - {ar: خَلَقَ, en: he created, pos: [فعل ماض, past verb], root: خلق, pattern: "فَعَلَ", present: يَخْلُقُ, bab: بَابُ نَصَرَ, ayah: {ref: "67:2", text: الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ, en: "the One who created death and life"}, note: "Same root: خَالِقٌ, Creator; خَلْقٌ, creation."}
  - {ar: غَاسِقٌ, en: darkness; the dark night, pos: [اسم فاعل, active participle], root: غسق, pattern: فَاعِلٌ, ayah: {ref: "17:78", text: إِلَىٰ غَسَقِ اللَّيْلِ, en: "until the darkness of the night"}, note: "غَسَقُ اللَّيْلِ is the deep dark of night (17:78). Most tafsir scholars take غَاسِق here as the night; a hadith in at-Tirmidhi points to the moon as a غَاسِق, and al-Tabari says the word covers every dark thing when it comes."}
  - {ar: عُقْدَةٌ, en: knot, pos: [اسم, noun], root: عقد, pattern: فُعْلَةٌ, plural: عُقَدٌ, ayah: {ref: "20:27", text: وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي, en: "and untie the knot from my tongue"}, note: "In 20:27 Musa عَلَيْهِ السَّلَامُ asks for the knot in his tongue to be untied."}
  - {ar: حَسَدَ, en: he envied, pos: [فعل ماض, past verb], root: حسد, pattern: "فَعَلَ", present: يَحْسُدُ, bab: بَابُ نَصَرَ, ayah: {ref: "4:54", text: أَمْ يَحْسُدُونَ النَّاسَ, en: "or do they envy people"}, note: "حَاسِدٌ (اسم فاعل) is the one who envies: he wants the good someone else has to be taken from them."}

grammar:
  title_ar: فِعْلُ الْأَمْرِ قُلْ
  title_en: "قُلْ: Say!"
  body: >-
    قُلْ is the فِعْلُ أَمْرٍ (command) from قَالَ يَقُولُ, he said. To make the command, start from the فِعْلٌ مُضَارِعٌ (present verb) يَقُولُ, drop the يَ, and
    end with sukun: قُولْ. Two sukuns cannot meet, so the long و drops: قُلْ. Allah tells the Prophet ﷺ to say these
    words, and they become words for every believer to say.
  examples:
    - [قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ, "Say: I seek refuge with the Lord of the daybreak"]
    - [قُلْ هُوَ اللَّهُ أَحَدٌ, "Say: He is Allah, One (112:1)"]
    - [قُلْ يَا أَيُّهَا الْكَافِرُونَ, "Say: O disbelievers (109:1)"]

tip:
  title: "Meaning note: the root فلق"
  body: >-
    فلق means to split open. فَالِقُ الْحَبِّ وَالنَّوَىٰ (6:95): the One who splits the seed and the date stone so a plant comes out.
    الْفَلَق is the daybreak, the light splitting the night. You ask the Lord who splits the darkness with morning
    to protect you from the dark things listed after it.

reread: Recite the surah from memory, then cover the grey word line and say the meaning of each word as you reach it.
