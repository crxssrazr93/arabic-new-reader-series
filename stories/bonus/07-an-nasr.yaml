  - {ar: اِسْتَغْفَرَ, en: he asked for forgiveness, pos: [فعل ماض, past verb], root: غفر, pattern: "اِسْتَفْعَلَ", present: يَسْتَغْفِرُ, bab: بَابُ الِاسْتِفْعَالِ, ayah: {ref: "71:10", text: فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا, en: "and I said: ask your Lord for forgiveness, He is ever Most Forgiving"}, note: "غَفَرَ is to forgive; بَابُ الِاسْتِفْعَالِ asks for it (الطَّلَبُ), like اِسْتَعَانَ in al-Fatiha. 71:10 ends إِنَّهُ كَانَ غَفَّارًا, very like this surah."}
  - {ar: تَوَّابٌ, en: one who accepts repentance again and again, pos: [صيغة مبالغة, intensive form], root: توب, pattern: فَعَّالٌ, ayah: {ref: "2:37", text: إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ, en: "truly He is the One who accepts repentance, the Most Merciful"}, note: "تَابَ means he turned back (repented); for Allah, it means He turns to the servant in mercy. فَعَّال means doing it a great deal."}

grammar:
  title_ar: إِذَا وَجَوَابُهَا
  title_en: "إِذَا: when ... then"
  body: >-
    إِذَا means "when" about something sure to happen. The verb after it is often a فِعْلٌ مَاضٍ (past verb) in form (جَاءَ) but future in meaning:
    when it comes. The answer (جواب) often starts with فَ: فَسَبِّحْ, then glorify. So the surah has one long sentence:
    when A and B happen, then do C.
  examples:
    - [إِذَا جَاءَ نَصْرُ اللَّهِ, "when Allah's help comes"]
    - [فَسَبِّحْ بِحَمْدِ رَبِّكَ, "then glorify your Lord with His praise"]
    - [مِن شَرِّ حَاسِدٍ إِذَا حَسَدَ, "from the evil of an envier when he envies (113:5)"]

tip:
  title: "Meaning note: the root سبح"
  body: >-
    سبح first means to swim or float far out. سَبَّحَ is to declare Allah far above every fault and weakness.
    Ibn Abbas رَضِيَ اللَّهُ عَنْهُمَا (may Allah be pleased with them both) understood this surah as a sign from Allah to the Prophet ﷺ that his life was near its end
    (Sahih al-Bukhari); so at the moment of victory the command is not to celebrate oneself but to glorify Allah and ask forgiveness.

