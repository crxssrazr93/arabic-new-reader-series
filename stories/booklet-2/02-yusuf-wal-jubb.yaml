# Booklet 2, story 2. Quran strand. Grammar ceiling: Madinah Book 1 end, Book 2 start.
id: b2-02
booklet: 2
number: 2
strand: quran
title_ar: يُوسُفُ وَالْجُبُّ
title_en: Yusuf and the Well
madinah: "Book 1 end and Book 2 start (past and present verbs, verb and subject agreement, kana lightly)"
source: "Quran 12:4 to 20, in order. Ya'qub's feelings in sentences 6 and 16 follow 12:5 and 12:13; Allah's revelation to Yusuf in sentence 19 follows 12:15. Sentence 38 gives the view Ibn Kathir and al-Tabari prefer on 12:20 (the brothers sold him; Qatada said the caravan). Also 12:3 (the best of stories) and 12:7."

