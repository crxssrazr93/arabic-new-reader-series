dictionary:
  - {ar: أَخٌ, en: brother, pos: [اسم, noun], root: أخو, plural: إِخْوَةٌ, ayah: {ref: "49:10", text: إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ, en: "the believers are but brothers"}, note: "Like أَبٌ, it grows a long vowel before a pronoun: أَخُوهُ, أَخَاهُ, أَخِيهِ. Two plurals: إِخْوَةٌ and إِخْوَانٌ. Later usage tends to keep إِخْوَةٌ for brothers by birth and إِخْوَانٌ for friends, but the Quran uses both ways: in this ayah the believers are إِخْوَةٌ."}
  - {ar: رُؤْيَا, en: dream; vision, pos: [اسم, noun], root: رأي, pattern: فُعْلَى, ayah: {ref: "37:105", text: قَدْ صَدَّقْتَ الرُّؤْيَا, en: "you have fulfilled the vision"}, note: "From رَأَى, he saw: what is seen in sleep. The ا at the end is not a case ending, so it never changes."}
  - {ar: كَوْكَبٌ, en: star; planet, pos: [اسم, noun], root: كوكب, plural: كَوَاكِبُ, ayah: {ref: "82:2", text: وَإِذَا الْكَوَاكِبُ انتَثَرَتْ, en: "and when the stars are scattered"}, note: "Four root letters. After أَحَدَ عَشَرَ the noun is singular with tanwin fath: كَوْكَبًا."}
  - {ar: قَمَرٌ, en: moon, pos: [اسم, noun], root: قمر, pattern: فَعَلٌ, ayah: {ref: "91:2", text: وَالْقَمَرِ إِذَا تَلَاهَا, en: "and by the moon when it follows it"}, note: "A moon letter: الْقَمَرُ keeps its lam. That is where the name moon letters comes from."}
  - {ar: كَيْدٌ, en: plot; scheme, pos: [مصدر, verbal noun], root: كيد, pattern: فَعْلٌ, ayah: {ref: "86:15", text: إِنَّهُمْ يَكِيدُونَ كَيْدًا, en: "they are plotting a plot"}, note: "The verb is كَادَ يَكِيدُ, to plot."}
  - {ar: قَتَلَ, en: he killed, pos: [فعل ماض, past verb], root: قتل, pattern: فَعَلَ, present: يَقْتُلُ, bab: بَابُ نَصَرَ, ayah: {ref: "81:9", text: بِأَيِّ ذَنبٍ قُتِلَتْ, en: "for what sin she was killed"}, note: "We kill: نَقْتُلُ. Kill! (to several people): اُقْتُلُوا."}
  - {ar: بَعْضٌ, en: some; part, pos: [اسم, noun], root: بعض, pattern: فَعْلٌ, ayah: {ref: "12:10", text: يَلْتَقِطْهُ بَعْضُ السَّيَّارَةِ, en: "some travellers will pick him up"}, note: "Usually in idafa or with a pronoun: بَعْضُهُمْ, some of them; بَعْضُنَا بِبَعْضٍ, one another."}
  - {ar: جُبٌّ, en: "well (deep, unlined)", pos: [اسم, noun], root: جبب, pattern: فُعْلٌ, ayah: {ref: "12:15", text: أَن يَجْعَلُوهُ فِي غَيَابَتِ الْجُبِّ, en: "to put him in the depths of the well"}, note: "Only in Surat Yusuf. The everyday word for a well is بِئْرٌ."}
  - {ar: غَدٌ, en: tomorrow, pos: [اسم, noun], root: غدو, ayah: {ref: "31:34", text: وَمَا تَدْرِي نَفْسٌ مَّاذَا تَكْسِبُ غَدًا, en: "and no soul knows what it will earn tomorrow"}, note: "غَدًا: tomorrow (as an adverb). فِي الْغَدِ: on the next day."}
  - {ar: حَزِنَ, en: he was sad, pos: [فعل ماض, past verb], root: حزن, pattern: فَعِلَ, present: يَحْزَنُ, bab: بَابُ سَمِعَ, ayah: {ref: "9:40", text: لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا, en: "do not grieve, Allah is with us"}, note: "A verb of بَابُ سَمِعَ usually takes a fatha in the present (a few take a kasra, like وَرِثَ in story 3). Sad: حَزِينٌ."}
  - {ar: خَافَ, en: he feared, pos: [فعل ماض, past verb], root: خوف, pattern: فَعِلَ, present: يَخَافُ, bab: بَابُ سَمِعَ, ayah: {ref: "106:4", text: وَآمَنَهُم مِّنْ خَوْفٍ, en: "and made them safe from fear"}, note: "I fear: أَخَافُ. Fear is خَوْفٌ, where the root و shows. خَافَ عَلَى: to fear for someone."}
  - {ar: ذِئْبٌ, en: wolf, pos: [اسم, noun], root: ذأب, pattern: فِعْلٌ, plural: ذِئَابٌ, ayah: {ref: "12:13", text: وَأَخَافُ أَن يَأْكُلَهُ الذِّئْبُ, en: "and I fear the wolf will eat him"}, note: "The words of Ya'qub عَلَيْهِ السَّلَامُ himself."}
  - {ar: أَوْحَى, en: he revealed; he inspired, pos: [فعل ماض, past verb], root: وحي, pattern: أَفْعَلَ, present: يُوحِي, bab: بَابُ الْإِفْعَالِ, ayah: {ref: "99:5", text: بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا, en: "because your Lord inspired it"}, note: "Revelation is وَحْيٌ. The last root letter is weak (لَفِيفٌ)."}
  - {ar: بَكَى, en: he wept, pos: [فعل ماض, past verb], root: بكي, pattern: فَعَلَ, present: يَبْكِي, bab: بَابُ ضَرَبَ, ayah: {ref: "53:60", text: وَتَضْحَكُونَ وَلَا تَبْكُونَ, en: "and you laugh and do not weep"}, note: "They weep: يَبْكُونَ. The opposite of ضَحِكَ."}
  - {ar: مَتَاعٌ, en: belongings; provision, pos: [اسم, noun], root: متع, pattern: فَعَالٌ, plural: أَمْتِعَةٌ, ayah: {ref: "80:32", text: مَّتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ, en: "as provision for you and your cattle"}, note: "Things you carry and use. In 12:17 the brothers say they left Yusuf عَلَيْهِ السَّلَامُ عِنْدَ مَتَاعِنَا."}
  - {ar: قَمِيصٌ, en: shirt, pos: [اسم, noun], root: قمص, pattern: فَعِيلٌ, plural: قُمْصَانٌ, ayah: {ref: "12:93", text: اذْهَبُوا بِقَمِيصِي هَـٰذَا, en: "take this shirt of mine"}, note: "The shirt of Yusuf عَلَيْهِ السَّلَامُ comes three times in his story: here, at the door (12:25), and at the end (12:93)."}
  - {ar: دَمٌ, en: blood, pos: [اسم, noun], root: دمي, plural: دِمَاءٌ, ayah: {ref: "12:18", text: بِدَمٍ كَذِبٍ, en: "with false blood"}, note: "Only two letters are written; the third root letter ي returns in the dual دَمَيَانِ, and shows as a hamza in the plural دِمَاءٌ."}
  - {ar: كَذِبٌ, en: lie; false, pos: [مصدر, verbal noun], root: كذب, pattern: فَعِلٌ, ayah: {ref: "96:16", text: نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ, en: "a lying, sinful forelock"}, note: "دَمٌ كَذِبٌ: the verbal noun is used as an adjective, blood that was a lie. A liar is كَاذِبٌ."}
  - {ar: صَبَرَ, en: he was patient, pos: [فعل ماض, past verb], root: صبر, pattern: فَعَلَ, present: يَصْبِرُ, bab: بَابُ ضَرَبَ, ayah: {ref: "2:153", text: إِنَّ اللَّهَ مَعَ الصَّابِرِينَ, en: "indeed Allah is with the patient"}, note: "Patience is صَبْرٌ: فَصَبْرٌ جَمِيلٌ (12:18)."}
  - {ar: غُلَامٌ, en: boy; young man, pos: [اسم, noun], root: غلم, pattern: فُعَالٌ, plural: غِلْمَانٌ, ayah: {ref: "12:19", text: هَـٰذَا غُلَامٌ, en: "this is a boy"}, note: "What the man at the well cried out when he found Yusuf عَلَيْهِ السَّلَامُ."}
  - {ar: دَلْوٌ, en: bucket, pos: [اسم, noun], root: دلو, pattern: فَعْلٌ, ayah: {ref: "12:19", text: فَأَدْلَىٰ دَلْوَهُ, en: "and he let down his bucket"}, note: "أَدْلَى: he let down, from the same root."}

root_families:
  - root: أخو
    words: [[أَخٌ, "brother"], [إِخْوَةٌ, "brothers"], [أُخْتٌ, "sister"], [أَخَوَاتٌ, "sisters"]]
  - root: رأي
    words: [[رَأَى, "he saw"], [يَرَى, "he sees"], [رُؤْيَا, "dream"], [رَأْيٌ, "opinion"]]

grammar:
  title_ar: الْفِعْلُ وَالْفَاعِلُ
  title_en: "The verb and its doer: who agrees with whom"
  body: >-
    When the verb comes before its فَاعِلٌ (doer), it stays singular, even if the doer is plural. It only shows masculine or feminine:
    قَالَ إِخْوَةُ يُوسُفَ عَلَيْهِ السَّلَامُ, جَاءَتْ سَيَّارَةٌ. When the noun comes first it is a مُبْتَدَأٌ (topic), and the verb after it agrees fully
    and carries a pronoun (the و of the group) as its own فَاعِلٌ: الْإِخْوَةُ ذَهَبُوا, هُمْ يَبْكُونَ. Once the brothers are known, every later verb about them is plural too: جَاءَ الْإِخْوَةُ ... قَالُوا.
  examples:
    - [قَالَ إِخْوَةُ يُوسُفَ, "Yusuf's brothers said."]
    - [جَاءَ الْإِخْوَةُ إِلَى أَبِيهِمْ وَهُمْ يَبْكُونَ, "The brothers came to their father weeping."]
    - [وَجَاءَتْ سَيَّارَةٌ فَأَرْسَلُوا وَارِدَهُمْ, "And a caravan came, and they sent their water drawer (12:19)"]

tip:
  title: "Reading without vowels: the alif of tanwin fath"
  body: >-
    An alif at the end of a noun, after a letter that cannot take a long a, is usually the seat of tanwin fath: كوكبا, غدا, غلاما,
    رجلا, شيئا. Read it -an inside the sentence and -ā when you stop: kawkaban inside the ayah, kawkabā if you stop on it. A word ending in
    ة takes tanwin fath with no alif: عجيبة. You know this from every ayah that ends كَيْدًا or عِلْمًا.

try_it:
  words: [يوسف, الجب, الذئب, غلاما, إخوته]
  sentence: جاء الإخوة إلى أبيهم وهم يبكون

reread: Cover the grey word line with a strip of paper and read the story again. Then recite Surat Yusuf 12:4 to 20 and find every sentence of this story in it.
