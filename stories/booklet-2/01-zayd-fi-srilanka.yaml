  - {ar: شَمْسٌ, en: sun, pos: [اسم, noun], root: شمس, pattern: فَعْلٌ, ayah: {ref: "91:1", text: وَالشَّمْسِ وَضُحَاهَا, en: "by the sun and its morning brightness"}, note: "A feminine word with no ة: الشَّمْسُ تَغْرُبُ, the sun sets."}
  - {ar: غَرَبَ, en: it set (the sun), pos: [فعل ماض, past verb], root: غرب, pattern: فَعَلَ, present: يَغْرُبُ, bab: بَابُ نَصَرَ, ayah: {ref: "18:86", text: وَجَدَهَا تَغْرُبُ فِي عَيْنٍ حَمِئَةٍ, en: "he found it setting in a spring of dark mud"}, note: "With the sun the present is تَغْرُبُ (the sun is feminine). The sunset prayer is الْمَغْرِبُ."}
  - {ar: شَيْءٌ, en: thing; something, pos: [اسم, noun], root: شيأ, pattern: فَعْلٌ, plural: أَشْيَاءُ, ayah: {ref: "2:20", text: إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ, en: "indeed Allah has power over everything"}, note: "شَيْئًا: something (as an object)."}
  - {ar: أَحَبَّ, en: he loved, pos: [فعل ماض, past verb], root: حبب, pattern: أَفْعَلَ, present: يُحِبُّ, bab: بَابُ الْإِفْعَالِ, ayah: {ref: "2:195", text: إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ, en: "indeed Allah loves those who do good"}, note: "I love: أُحِبُّ. A doubled root (مُضَعَّفٌ): the two ب join. In بَابُ الْإِفْعَالِ the present prefix takes a damma."}

root_families:
  - root: طير
    words: [[طَارَ, "it flew"], [طَيْرٌ, "birds"], [طَائِرٌ, "a bird; a flier"], [طَائِرَةٌ, "aeroplane"], [مَطَارٌ, "airport"]]
  - root: سفر
    words: [[سَافَرَ, "he travelled"], [سَفَرٌ, "journey"], [مُسَافِرٌ, "traveller"]]

grammar:
  title_ar: الْفِعْلُ الْمُضَارِعُ
  title_en: "The مُضَارِع verb: present, habit and future (يَفْعَلُ)"
  body: >-
    The فِعْلٌ مَاضٍ (past verb, فَعَلَ) tells what was done. The فِعْلٌ مُضَارِعٌ (يَفْعَلُ) tells what is being done, what is usually done,
    or what will be done (بِلَالٌ يَقْرَأُ مَعَكَ, Bilal will read with you).
    It is built by adding one letter in front of the root: أَ for "I", نَ for "we", يَ for "he", تَ for "you" and for "she".
    In a صَحِيحٌ سَالِمٌ verb (three strong root letters) the first root letter takes a sukun and the ending is a damma (مَرْفُوعٌ): ذَهَبَ, يَذْهَبُ.
    A hollow verb such as نَامَ is an exception: the first root letter takes a fatha (تَنَامُ, أَنَامُ). For "they" add ـُونَ: يَحْفَظُونَ.
    Put لَا in front to say "not": لَا نَرَى.
  examples:
    - [أَنَا أَسْبَحُ هُنَا, "I swim here."]
    - [أَنْتَ تَنَامُ هُنَا وَأَنَا أَنَامُ هُنَاكَ, "You sleep here and I sleep there. (hollow verb: exception)"]
    - [يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا, "entering the religion of Allah in crowds (110:2)"]

tip:
  title: "Reading without vowels: the letters أ ن ي ت"
  body: >-
    Teachers remember the present prefixes as أَنَيْتُ: أ ن ي ت. When a word starts with one of these four letters and is followed by
    three root letters you know, it is very likely a present verb: أسبح, نرى, يقرأ, تحفظ. Read the prefix with a fatha and, in a صَحِيحٌ سَالِمٌ verb, the first
    root letter with a sukun: ya-q-ra-'u, ta-ḥ-fa-ẓu. Weak verbs like نرى and تنام differ, so check the dictionary. Verbs of بَابُ الْإِفْعَالِ like أحبّ take a damma on the prefix: uḥibbu, yuḥibbu.

try_it:
  words: [يقرأ, أسبح, نرى, البحر, الطائرة]
  sentence: أنت تنام هنا وأنا أنام هناك

reread: Cover the grey word line with a strip of paper and read the story again. Underline every present verb and say who is doing it.
