  - {ar: طَائِرَةٌ, en: aeroplane, pos: [اسم فاعل, active participle], root: طير, pattern: فَاعِلَةٌ, plural: طَائِرَاتٌ, ayah: {ref: "67:19", text: أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ, en: "have they not seen the birds above them, spreading their wings"}, register: modern, note: "Literally a flying thing (طَارَ, it flew). The Quran has طَيْرٌ, birds, from the same root."}
