dictionary:
  - {ar: سَافَرَ, en: he travelled, pos: [فعل ماض, past verb], root: سفر, pattern: فَاعَلَ, present: يُسَافِرُ, bab: بَابُ الْمُفَاعَلَةِ, ayah: {ref: "2:184", text: أَوْ عَلَىٰ سَفَرٍ, en: "or on a journey"}, note: "A traveller is مُسَافِرٌ; a journey is سَفَرٌ. In بَابُ الْمُفَاعَلَةِ a long ا follows the first root letter, and the present prefix takes a damma."}
