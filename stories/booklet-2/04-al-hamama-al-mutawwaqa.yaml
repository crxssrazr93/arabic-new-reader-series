  - {ar: شَجَرَةٌ, en: tree, pos: [اسم, noun], root: شجر, pattern: فَعَلَةٌ, plural: أَشْجَارٌ, ayah: {ref: "55:6", text: وَالنَّجْمُ وَالشَّجَرُ يَسْجُدَانِ, en: "and the plants and the trees bow down"}, note: "شَجَرٌ is trees together; one tree is شَجَرَةٌ. Plural أَشْجَارٌ on the pattern أَفْعَالٌ."}
  - {ar: غُصْنٌ, en: branch, pos: [اسم, noun], root: غصن, pattern: فُعْلٌ, plural: أَغْصَانٌ, note: "Not in the Quran, which has أَفْنَانٌ, branches (55:48). Plural on the pattern أَفْعَالٌ."}
  - {ar: غُرَابٌ, en: crow; raven, pos: [اسم, noun], root: غرب, pattern: فُعَالٌ, plural: غِرْبَانٌ, ayah: {ref: "5:31", text: فَبَعَثَ اللَّهُ غُرَابًا يَبْحَثُ فِي الْأَرْضِ, en: "then Allah sent a crow scratching in the ground"}, note: "The crow that showed the son of Adam عَلَيْهِ السَّلَامُ how to bury his brother."}
  - {ar: شَبَكَةٌ, en: net, pos: [اسم, noun], root: شبك, pattern: فَعَلَةٌ, plural: شِبَاكٌ, register: both, note: "Not in the Quran. Today also a network, and the internet: الشَّبَكَةُ."}
  - {ar: حَبٌّ, en: grain; seeds, pos: [اسم, noun], root: حبب, pattern: فَعْلٌ, plural: حُبُوبٌ, ayah: {ref: "6:95", text: إِنَّ اللَّهَ فَالِقُ الْحَبِّ وَالنَّوَىٰ, en: "Allah is the One who splits the grain and the date stone"}, note: "Same root as حُبٌّ, love, and أَحَبَّ: only the vowel differs. One seed is حَبَّةٌ."}
  - {ar: حَمَامَةٌ, en: dove; pigeon, pos: [اسم, noun], root: حمم, pattern: فَعَالَةٌ, plural: "حَمَائِمُ، حَمَامَاتٌ", note: "حَمَامٌ is an اسْمُ جِنْسٍ جَمْعِيٌّ (doves as a kind, not the plural), and it is masculine: نَزَلَ الْحَمَامُ. الْمُطَوَّقَةُ: the one with a ring (طَوْقٌ) round her neck."}
