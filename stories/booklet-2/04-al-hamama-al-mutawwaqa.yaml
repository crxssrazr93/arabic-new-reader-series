dictionary:
  - {ar: صَيَّادٌ, en: hunter, pos: [اسم, noun], root: صيد, pattern: فَعَّالٌ, plural: صَيَّادُونَ, ayah: {ref: "5:96", text: أُحِلَّ لَكُمْ صَيْدُ الْبَحْرِ, en: "game from the sea is made lawful for you"}, note: "فَعَّالٌ is the pattern for a trade: صَيَّادٌ, طَبَّاخٌ. Hunting, or the game hunted, is صَيْدٌ."}
