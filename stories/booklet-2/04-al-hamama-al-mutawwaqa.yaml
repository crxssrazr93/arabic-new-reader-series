# Booklet 2, story 4. Tale strand, told in class by Ustadh Hamid. Grammar ceiling: Madinah Book 1 end, Book 2 start.
id: b2-04
booklet: 2
number: 4
strand: tale
title_ar: الْحَمَامَةُ الْمُطَوَّقَةُ
title_en: The Ring Dove
madinah: "Book 1 end and Book 2 start (broken plurals, past and present verbs, kana lightly)"
source: "Kalila wa Dimna (Ibn al-Muqaffa'), Bab al-Hamama al-Mutawwaqa, opening episode (the hunter's net, the doves fly off with it, the rat Zirak gnaws it), retold simply. The crow's friendship with the rat and the later episodes are left out."

