grammar:
  title_ar: جَمْعُ التَّكْسِيرِ
  title_en: "Broken plurals"
  body: >-
    Most Arabic plurals are "broken": the root letters stay, but the vowels and extra letters inside the word change.
    You must learn each plural with its singular, but a few patterns come back again and again: أَفْعَالٌ (غُصْنٌ, أَغْصَانٌ),
    فُعُولٌ (جُحْرٌ, جُحُورٌ), فُعَلٌ (عُقْدَةٌ, عُقَدٌ), أَفْعِلَاءُ (صَدِيقٌ, أَصْدِقَاءُ). A broken plural of things, not people,
    takes a feminine singular نَعْتٌ (describing word): أَغْصَانٌ كَثِيرَةٌ.
  examples:
    - [شَجَرَةٌ لَهَا أَغْصَانٌ كَثِيرَةٌ, "a tree with many branches"]
    - [اِبْدَأْ بِعُقَدِ أَخَوَاتِي, "start with my sisters' knots"]
    - [بِأَسْنَانِهِ, "with his teeth (سِنٌّ, plural أَسْنَانٌ)"]

tip:
  title: "Reading without vowels: the plural patterns أفعال and فعول"
  body: >-
    A word that starts with أ and has ا before its last letter (أغصان, أسنان, أشجار, أصوات) is usually a plural on أَفْعَالٌ:
    read a-f-'ā-l, ag-ṣān, as-nān. A word with و before its last letter and three root letters around it (جحور, بيوت, صفوف, طيور)
    is usually فُعُولٌ: read u then ū, ju-ḥūr, bu-yūt. Spot the pattern, and the vowels come with it.

