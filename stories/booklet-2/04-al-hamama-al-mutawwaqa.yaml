  - {ar: جُرَذٌ, en: rat; large mouse, pos: [اسم, noun], root: جرذ, pattern: فُعَلٌ, plural: جِرْذَانٌ, note: "Not in the Quran. A small mouse is فَأْرٌ. In the original book the rat's name is زِيرَكُ."}
  - {ar: جُحْرٌ, en: hole; burrow, pos: [اسم, noun], root: جحر, pattern: فُعْلٌ, plural: جُحُورٌ, note: "Not in the Quran. Plural on the pattern فُعُولٌ, like بُيُوتٌ."}
  - {ar: بَدَأَ, en: he began, pos: [فعل ماض, past verb], root: بدأ, pattern: فَعَلَ, present: يَبْدَأُ, bab: بَابُ فَتَحَ, ayah: {ref: "29:20", text: كَيْفَ بَدَأَ الْخَلْقَ, en: "how He began the creation"}, note: "بَدَأَ يَفْعَلُ: he began to do. Start!: اِبْدَأْ."}
  - {ar: قَرَضَ, en: he gnawed; he cut, pos: [فعل ماض, past verb], root: قرض, pattern: فَعَلَ, present: يَقْرِضُ, bab: بَابُ ضَرَبَ, ayah: {ref: "18:17", text: وَإِذَا غَرَبَت تَّقْرِضُهُمْ ذَاتَ الشِّمَالِ, en: "and when it set, it passed them by on the left"}, register: both, note: "In the Quran: the sun cuts past the cave, leaving them aside. Of a mouse: to gnaw."}
  - {ar: عُقْدَةٌ, en: knot, pos: [اسم, noun], root: عقد, pattern: فُعْلَةٌ, plural: عُقَدٌ, ayah: {ref: "20:27", text: وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي, en: "and untie a knot from my tongue"}, note: "The du'a of Musa عَلَيْهِ السَّلَامُ. Plural on the pattern فُعَلٌ."}
  - {ar: سِنٌّ, en: tooth; age, pos: [اسم, noun], root: سنن, pattern: فِعْلٌ, plural: أَسْنَانٌ, ayah: {ref: "5:45", text: وَالسِّنَّ بِالسِّنِّ, en: "and a tooth for a tooth"}, note: "Feminine. Plural on the pattern أَفْعَالٌ. Today also a person's age."}

