grammar:
  title_ar: جَمْعُ الْمُؤَنَّثِ السَّالِمِ
  title_en: "The sound feminine plural: ـَاتٌ"
  body: >-
    Many feminine words, and many words ending in ة, make their plural by dropping the ة and adding ـَاتٌ: سَاعَةٌ, سَاعَاتٌ.
    A noun on فَعْلَةٌ also opens its middle letter: تَمْرَةٌ, تَمَرَاتٌ; رَكْعَةٌ, رَكَعَاتٌ. The special rule: when it is مَنْصُوبٌ (for example as مَفْعُولٌ بِهِ, object)
    it does not take a fatha. It keeps a kasra: وَضَعَتْ تَمَرَاتٍ, أُحِبُّ صَلَوَاتِهِ.
  examples:
    - [بَعْدَ سَاعَاتٍ طَوِيلَةٍ, "after long hours (مَجْرُورٌ)"]
    - [وَضَعَتْ مَرْيَمُ تَمَرَاتٍ, "Maryam put out dates. (مَنْصُوبٌ, still a kasra)"]
    - [إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ, "good deeds wipe away bad deeds (11:114)"]

tip:
  title: "Reading without vowels: لِلْ, the joined lam before ال"
  body: >-
    When لِـ (for, to) meets ال, the alif drops and you see two lams: للسحور, للصلاة, لله. Read the first lam with a kasra and
    then go on as ال would: lis-saḥūr, liṣ-ṣalāh, lil-lāh. Sun letters still double: للسحور is lis-saḥūr, not lil-saḥūr.
    The same alif also falls silent after و and ف: والشراب is wash-sharāb.

try_it:
  words: [رمضان, للسحور, التمرات, الصلوات, ساعات]
  sentence: وضعت مريم على المائدة تمرات وأكواب ماء

reread: Cover the grey word line with a strip of paper and read the story again. Find every word ending in ـات and say its singular.
