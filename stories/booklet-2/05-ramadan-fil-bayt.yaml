dictionary:
  - {ar: شَهْرٌ, en: month, pos: [اسم, noun], root: شهر, pattern: فَعْلٌ, plural: أَشْهُرٌ, ayah: {ref: "2:185", text: شَهْرُ رَمَضَانَ الَّذِي أُنزِلَ فِيهِ الْقُرْآنُ, en: "the month of Ramadan, in which the Quran was sent down"}, note: "رَمَضَانُ never takes tanwin or kasra: شَهْرُ رَمَضَانَ."}
  - {ar: صَامَ, en: he fasted, pos: [فعل ماض, past verb], root: صوم, pattern: فَعَلَ, present: يَصُومُ, bab: بَابُ نَصَرَ, ayah: {ref: "2:184", text: وَأَن تَصُومُوا خَيْرٌ لَّكُمْ, en: "and that you fast is better for you"}, note: "We fast: نَصُومُ. Fasting: صِيَامٌ or صَوْمٌ."}
  - {ar: قَامَ, en: he stood up; he got up, pos: [فعل ماض, past verb], root: قوم, pattern: فَعَلَ, present: يَقُومُ, bab: بَابُ نَصَرَ, ayah: {ref: "73:2", text: قُمِ اللَّيْلَ إِلَّا قَلِيلًا, en: "stand in prayer through the night, except a little"}, note: "Same root as قَوْمٌ, a people, and قِيَامُ اللَّيْلِ, the night prayer."}
  - {ar: سَحُورٌ, en: suhur (the meal before dawn), pos: [اسم, noun], root: سحر, pattern: فَعُولٌ, ayah: {ref: "51:18", text: وَبِالْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ, en: "and in the hours before dawn they ask forgiveness"}, note: "From سَحَرٌ, the last part of the night (plural أَسْحَارٌ). سَحُورٌ is the food; سُحُورٌ is eating it."}
  - {ar: مَائِدَةٌ, en: table (spread with food), pos: [اسم, noun], root: ميد, pattern: فَاعِلَةٌ, plural: مَوَائِدُ, ayah: {ref: "5:114", text: أَنزِلْ عَلَيْنَا مَائِدَةً مِّنَ السَّمَاءِ, en: "send down to us a table spread with food from the sky"}, note: "Surah 5 is named after it."}
  - {ar: شَرِبَ, en: he drank, pos: [فعل ماض, past verb], root: شرب, pattern: فَعِلَ, present: يَشْرَبُ, bab: بَابُ سَمِعَ, ayah: {ref: "7:31", text: وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا, en: "and eat and drink, but do not waste"}, note: "A drink: شَرَابٌ."}
  - {ar: لَبَنٌ, en: milk, pos: [اسم, noun], root: لبن, pattern: فَعَلٌ, ayah: {ref: "16:66", text: لَّبَنًا خَالِصًا سَائِغًا لِّلشَّارِبِينَ, en: "pure milk, easy to swallow for those who drink"}, register: both, note: "In the Quran and in Sri Lanka: milk. In some Arab countries today it also means yoghurt."}
  - {ar: أَذَانٌ, en: adhan; call to prayer, pos: [اسم, noun], root: أذن, pattern: فَعَالٌ, ayah: {ref: "9:3", text: وَأَذَانٌ مِّنَ اللَّهِ وَرَسُولِهِ, en: "and an announcement from Allah and His Messenger ﷺ"}, register: both, note: "In the Quran: a public announcement. Today: the call to prayer. Same root as أُذُنٌ, ear."}
  - {ar: نَهَارٌ, en: daytime, pos: [اسم, noun], root: نهر, pattern: فَعَالٌ, ayah: {ref: "78:11", text: وَجَعَلْنَا النَّهَارَ مَعَاشًا, en: "and We made the day for seeking a living"}, note: "The opposite of لَيْلٌ. Same root as نَهْرٌ, river."}
  - {ar: إِفْطَارٌ, en: iftar; breaking the fast, pos: [مصدر, verbal noun], root: فطر, pattern: إِفْعَالٌ, ayah: {ref: "30:30", text: فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا, en: "the nature Allah made people with"}, register: both, note: "The root means to split or begin. فَطَرَ: He created (in the Quran); أَفْطَرَ: he broke his fast."}
  - {ar: تَمْرَةٌ, en: a date (fruit), pos: [اسم, noun], root: تمر, pattern: فَعْلَةٌ, plural: تَمَرَاتٌ, note: "تَمْرٌ is dates together. Its sound plural تَمَرَاتٌ adds a fatha on the middle letter. The word تَمْرٌ is not in the Quran; it speaks of ثَمَرَاتِ النَّخِيلِ, the fruits of the date palms (16:67), and of fresh dates, رُطَبًا (19:25)."}
  - {ar: كُوبٌ, en: glass; cup, pos: [اسم, noun], root: كوب, pattern: فُعْلٌ, plural: أَكْوَابٌ, ayah: {ref: "88:14", text: وَأَكْوَابٌ مَّوْضُوعَةٌ, en: "and cups set out"}, note: "Plural on the pattern أَفْعَالٌ: the cups of Paradise."}
  - {ar: اِنْتَظَرَ, en: he waited, pos: [فعل ماض, past verb], root: نظر, pattern: اِفْتَعَلَ, present: يَنْتَظِرُ, bab: بَابُ الِافْتِعَالِ, ayah: {ref: "32:30", text: وَانتَظِرْ إِنَّهُم مُّنتَظِرُونَ, en: "and wait, for they too are waiting"}, note: "In بَابُ الِافْتِعَالِ a ت comes after the first root letter. Same root as نَظَرَ, he looked: you look out for what you wait for."}
  - {ar: سَاعَةٌ, en: hour; the Hour, pos: [اسم, noun], root: سوع, pattern: فَعَلَةٌ, plural: سَاعَاتٌ, ayah: {ref: "54:1", text: اقْتَرَبَتِ السَّاعَةُ, en: "the Hour has drawn near"}, register: both, note: "In the Quran usually the Hour of Judgement. Today also an hour, and a watch or clock."}
  - {ar: صَلَاةٌ, en: prayer; salah, pos: [اسم, noun], root: صلو, plural: صَلَوَاتٌ, ayah: {ref: "2:238", text: حَافِظُوا عَلَى الصَّلَوَاتِ, en: "guard the prayers"}, note: "The verb is صَلَّى. The plural صَلَوَاتٌ shows the root و."}
  - {ar: تَرَاوِيحُ, en: Taraweeh (the night prayers of Ramadan), pos: [جمع تكسير, broken plural], root: روح, pattern: تَفَاعِيلُ, note: "Plural of تَرْوِيحَةٌ, a rest: the people rest between every four rak'as. Same root as رَائِحَةٌ and رِيحٌ. No tanwin."}
  - {ar: إِمَامٌ, en: imam; leader, pos: [اسم, noun], root: أمم, pattern: فِعَالٌ, plural: أَئِمَّةٌ, ayah: {ref: "2:124", text: إِنِّي جَاعِلُكَ لِلنَّاسِ إِمَامًا, en: "I will make you a leader for the people"}, note: "Said to Ibrahim عَلَيْهِ السَّلَامُ. Same root as أُمٌّ and أَمَامَ, in front: the imam stands in front."}
  - {ar: رَكْعَةٌ, en: "rak'a (one unit of prayer)", pos: [اسم, noun], root: ركع, pattern: فَعْلَةٌ, plural: رَكَعَاتٌ, ayah: {ref: "2:43", text: وَارْكَعُوا مَعَ الرَّاكِعِينَ, en: "and bow with those who bow"}, note: "From رَكَعَ, he bowed. Like تَمَرَاتٌ, the plural adds a fatha: رَكَعَاتٌ."}
  - {ar: أَوَّلُ, en: first, pos: [اسم تفضيل, elative adjective], root: أول, pattern: أَفْعَلُ, ayah: {ref: "57:3", text: هُوَ الْأَوَّلُ وَالْآخِرُ, en: "He is the First and the Last"}, note: "No tanwin on أَوَّلُ as an adjective (الصَّفُّ الْأَوَّلُ), like أَخْضَرُ in story 1. The adverb أَوَّلًا (story 4, first) does take tanwin. Opposite: آخِرٌ, last; آخِرُ اللَّيْلِ, the end of the night."}
  - {ar: فَضْلٌ, en: bounty; grace, pos: [اسم, noun], root: فضل, pattern: فَعْلٌ, ayah: {ref: "62:4", text: ذَٰلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَن يَشَاءُ, en: "that is the bounty of Allah, He gives it to whom He wills"}, note: "Same root as فَضَّلَ, He favoured (27:15)."}
  - {ar: حَسَنَةٌ, en: good deed, pos: [اسم, noun], root: حسن, pattern: فَعَلَةٌ, plural: حَسَنَاتٌ, ayah: {ref: "11:114", text: إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ, en: "good deeds wipe away bad deeds"}, note: "Two sound feminine plurals in one ayah: الْحَسَنَاتِ and السَّيِّئَاتِ."}

