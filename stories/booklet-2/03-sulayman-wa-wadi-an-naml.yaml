  - {ar: عِلْمٌ, en: knowledge, pos: [مصدر, verbal noun], root: علم, pattern: فِعْلٌ, plural: عُلُومٌ, ayah: {ref: "20:114", text: وَقُل رَّبِّ زِدْنِي عِلْمًا, en: "and say: my Lord, increase me in knowledge"}}
  - {ar: وَرِثَ, en: he inherited, pos: [فعل ماض, past verb], root: ورث, pattern: فَعِلَ, present: يَرِثُ, bab: بَابُ حَسِبَ, ayah: {ref: "19:6", text: يَرِثُنِي وَيَرِثُ مِنْ آلِ يَعْقُوبَ, en: "who will inherit from me and from the family of Ya'qub"}, note: "بَابُ حَسِبَ takes a kasra in the present (يَرِثُ), and the first root letter و drops. The du'a of Zakariyya عَلَيْهِ السَّلَامُ for a son. In 27:16 the tafsir books explain that Sulayman inherited prophethood and kingship, not wealth."}
  - {ar: طَيْرٌ, en: birds, pos: [اسم, noun], root: طير, pattern: فَعْلٌ, plural: طُيُورٌ, ayah: {ref: "105:3", text: وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ, en: "and He sent against them birds in flocks"}, note: "An اسْمُ جِنْسٍ جَمْعِيٌّ (birds as a kind), like نَمْلٌ for ants and حَمَامٌ for doves. One bird is طَائِرٌ."}
  - {ar: جُنْدٌ, en: army; soldiers, pos: [اسم, noun], root: جند, pattern: فُعْلٌ, plural: جُنُودٌ, ayah: {ref: "85:17", text: هَلْ أَتَاكَ حَدِيثُ الْجُنُودِ, en: "has the story of the armies reached you"}, note: "One soldier today is جُنْدِيٌّ."}
  - {ar: جِنٌّ, en: jinn, pos: [اسم, noun], root: جنن, pattern: فِعْلٌ, ayah: {ref: "55:33", text: يَا مَعْشَرَ الْجِنِّ وَالْإِنسِ, en: "O company of jinn and mankind"}, note: "Hidden beings made of fire. Their partner word is الْإِنْسُ, mankind. Same root as جَنَّةٌ (a hidden garden)."}
  - {ar: سَارَ, en: he travelled; he marched, pos: [فعل ماض, past verb], root: سير, pattern: فَعَلَ, present: يَسِيرُ, bab: بَابُ ضَرَبَ, ayah: {ref: "52:10", text: وَتَسِيرُ الْجِبَالُ سَيْرًا, en: "and the mountains move along"}, note: "A car (سَيَّارَةٌ) and a caravan come from this root."}
  - {ar: صَفٌّ, en: row; line, pos: [اسم, noun], root: صفف, pattern: فَعْلٌ, plural: صُفُوفٌ, ayah: {ref: "89:22", text: وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا, en: "and your Lord comes, with the angels rank upon rank"}, note: "Also a school class today: الصَّفُّ الْأَوَّلُ, the first year."}
  - {ar: وَادٍ, en: valley, pos: [اسم, noun], root: ودي, pattern: فَاعِلٌ, plural: أَوْدِيَةٌ, ayah: {ref: "20:12", text: إِنَّكَ بِالْوَادِ الْمُقَدَّسِ طُوًى, en: "you are in the sacred valley of Tuwa"}, note: "With ال: الْوَادِي. The Quran writes it without the final ي: وَادِ النَّمْلِ."}
  - {ar: نَمْلٌ, en: ants, pos: [اسم, noun], root: نمل, pattern: فَعْلٌ, ayah: {ref: "27:18", text: حَتَّىٰ إِذَا أَتَوْا عَلَىٰ وَادِ النَّمْلِ, en: "until, when they came to the valley of the ants"}, note: "An اسْمُ جِنْسٍ جَمْعِيٌّ (ants as a kind). One ant is نَمْلَةٌ. Surah 27 is named after them."}
  - {ar: فَهِمَ, en: he understood, pos: [فعل ماض, past verb], root: فهم, pattern: فَعِلَ, present: يَفْهَمُ, bab: بَابُ سَمِعَ, ayah: {ref: "21:79", text: فَفَهَّمْنَاهَا سُلَيْمَانَ, en: "and We gave Sulayman understanding of it"}, note: "فَهَّمَ (with shadda): he made someone understand."}
  - {ar: تَبَسَّمَ, en: he smiled, pos: [فعل ماض, past verb], root: بسم, pattern: تَفَعَّلَ, present: يَتَبَسَّمُ, bab: بَابُ التَّفَعُّلِ, ayah: {ref: "27:19", text: فَتَبَسَّمَ ضَاحِكًا مِّن قَوْلِهَا, en: "so he smiled, laughing at her words"}, note: "In بَابُ التَّفَعُّلِ the verb has تَـ in front and a shadda on the middle letter."}
  - {ar: شَكَرَ, en: he thanked, pos: [فعل ماض, past verb], root: شكر, pattern: فَعَلَ, present: يَشْكُرُ, bab: بَابُ نَصَرَ, ayah: {ref: "14:7", text: لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ, en: "if you are grateful, I will surely give you more"}, note: "Thanks: شُكْرٌ."}
  - {ar: نِعْمَةٌ, en: favour; blessing, pos: [اسم, noun], root: نعم, pattern: فِعْلَةٌ, plural: نِعَمٌ, ayah: {ref: "93:11", text: وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ, en: "and as for the favour of your Lord, speak of it"}, note: "Same root as أَنْعَمَ, He bestowed. It is spelled with the same letters as نَعَمْ (yes), but نَعَمْ is a حَرْفٌ and a حَرْفٌ has no root."}
  - {ar: رَحْمَةٌ, en: mercy, pos: [مصدر, verbal noun], root: رحم, pattern: فَعْلَةٌ, ayah: {ref: "21:107", text: وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ, en: "and We sent you (O Prophet ﷺ) only as a mercy to the worlds"}, note: "Same root as الرَّحْمَـٰنُ and الرَّحِيمُ."}
  - {ar: صَالِحٌ, en: righteous; good, pos: [اسم فاعل, active participle], root: صلح, pattern: فَاعِلٌ, plural: صَالِحُونَ, ayah: {ref: "21:105", text: أَنَّ الْأَرْضَ يَرِثُهَا عِبَادِيَ الصَّالِحُونَ, en: "that the earth will be inherited by My righteous servants"}, note: "Sound plural: الصَّالِحُونَ as subject, الصَّالِحِينَ after a preposition (27:19)."}
  - {ar: مُؤْمِنٌ, en: believer, pos: [اسم فاعل, active participle], root: أمن, pattern: مُفْعِلٌ, plural: مُؤْمِنُونَ, ayah: {ref: "23:1", text: قَدْ أَفْلَحَ الْمُؤْمِنُونَ, en: "the believers have succeeded"}, note: "One who believes (آمَنَ). Feminine plural: مُؤْمِنَاتٌ."}
  - {ar: دُعَاءٌ, en: dua; prayer of asking, pos: [مصدر, verbal noun], root: دعو, pattern: فُعَالٌ, plural: أَدْعِيَةٌ, ayah: {ref: "14:40", text: رَبَّنَا وَتَقَبَّلْ دُعَاءِ, en: "our Lord, and accept my prayer"}, note: "The verbal noun of دَعَا. The du'a of Ibrahim عَلَيْهِ السَّلَامُ; the Quran writes دُعَاءِ, my prayer, without the final ي."}
  - {ar: كَلَامٌ, en: speech; words, pos: [اسم, noun], root: كلم, pattern: فَعَالٌ, ayah: {ref: "9:6", text: حَتَّىٰ يَسْمَعَ كَلَامَ اللَّهِ, en: "until he hears the words of Allah"}, note: "كَلَامُ اللَّهِ: the Quran."}
  - {ar: مَسْكَنٌ, en: dwelling; home, pos: [اسم مكان, noun of place], root: سكن, pattern: مَفْعَلٌ, plural: مَسَاكِنُ, ayah: {ref: "27:18", text: ادْخُلُوا مَسَاكِنَكُمْ, en: "enter your dwellings"}, note: "The place where you live (سَكَنَ يَسْكُنُ). The plural مَسَاكِنُ never takes tanwin."}

