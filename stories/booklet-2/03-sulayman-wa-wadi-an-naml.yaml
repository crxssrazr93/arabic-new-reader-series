# Booklet 2, story 3. Quran strand, read in class with Ustadh Hamid. Grammar ceiling: Madinah Book 1 end, Book 2 start.
id: b2-03
booklet: 2
number: 3
strand: quran
title_ar: سُلَيْمَانُ وَوَادِي النَّمْلِ
title_en: Sulayman and the Valley of the Ants
madinah: "Book 1 end and Book 2 start (sound masculine plural, past and present verbs, kana lightly)"
source: "Quran 27:15 to 19, in order. Also 2:251 and 38:35 (Dawud and Sulayman as kings), 21:79 (Allah gave Sulayman understanding). Sentence 9 gives the tafsir of 27:16, attributed in the sentence (Ibn Kathir, al-Baghawi and al-Qurtubi: prophethood and kingship, not wealth; al-Tabari: knowledge and kingship). The teacher's remarks after the ayat are reflections, not part of the narration."

