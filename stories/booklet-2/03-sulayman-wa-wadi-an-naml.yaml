grammar:
  title_ar: جَمْعُ الْمُذَكَّرِ السَّالِمِ
  title_en: "The sound masculine plural: ـُونَ and ـِينَ"
  body: >-
    Many words for male people (and words used for them) make their plural by adding an ending, without changing the word:
    مُؤْمِنٌ, مُؤْمِنُونَ. The ending is ـُونَ when the word is مَرْفُوعٌ (a مُبْتَدَأٌ (topic), خَبَرٌ (predicate) or فَاعِلٌ (doer)), and ـِينَ when it is مَجْرُورٌ (after a حَرْفُ جَرٍّ, preposition)
    or مَنْصُوبٌ (as مَفْعُولٌ بِهِ (object) or as خَبَرُ كَانَ). The ن at the end never takes tanwin and drops in مُضَافٌ (the first word of an idafa).
  examples:
    - [الْمُؤْمِنُونَ يَشْكُرُونَ اللَّهَ, "Believers thank Allah. (مُبْتَدَأٌ)"]
    - [وَكَانُوا كَثِيرِينَ, "and they were many. (خَبَرُ كَانَ)"]
    - [فِي عِبَادِكَ الصَّالِحِينَ, "among Your righteous servants (27:19)"]

tip:
  title: "Reading without vowels: the long letters are written"
  body: >-
    Even with no marks at all, the long vowels are always on the page: ا is ā, و is ū, ي is ī. Read them first and the word
    almost reads itself: the name of Sulayman عَلَيْهِ السَّلَامُ, سليمان, is su-lay-mān, جنود is ju-nūd, الصالحين is aṣ-ṣā-li-ḥīn. Usually ا is ā, و is ū and ي is ī; but after a fatha, ي and و can be consonants (ay, aw), as in سُلَيْمَان and يَوْم. Only the short vowels are missing,
    and the pattern of the word usually tells you those.

