dictionary:
  - {ar: آيَةٌ, en: ayah; sign, pos: [اسم, noun], root: أيي, pattern: فَعْلَةٌ, plural: آيَاتٌ, ayah: {ref: "12:7", text: لَّقَدْ كَانَ فِي يُوسُفَ وَإِخْوَتِهِ آيَاتٌ لِّلسَّائِلِينَ, en: "in Yusuf and his brothers there are signs for those who ask"}, register: both, note: "A sign from Allah, and a verse of the Quran. Plural with ـَاتٌ."}
