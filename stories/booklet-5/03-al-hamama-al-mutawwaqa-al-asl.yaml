grammar:
  title_ar: الشَّرْطُ بِـإِنْ وَلَوْ
  title_en: "The conditional: in and law"
  body: >-
    إِنْ, if, sets a real possibility. Classical Arabic often puts a past verb after it with a future meaning, and the answer is a past
    verb too, or لَمْ with a مَجْزُومٌ verb (jussive): إِنْ نَحْنُ أَخَذْنَا ... لَمْ يَخْفَ (if we set off ... it will not be hidden). A pronoun after إِنْ, as in
    إِنْ نَحْنُ and إِنْ أَنْتَ, is a فَاعِلٌ لِفِعْلٍ مَحْذُوفٍ يُفَسِّرُهُ الْمَذْكُورُ (the doer of a dropped verb that the verb after it explains): إِنْ must be followed by a verb, so one is understood before the pronoun.
    لَوْ, if, is in the madrasa's words حَرْفُ امْتِنَاعٍ لِامْتِنَاعٍ (it names something that did not happen). Here the dove uses it like إِنْ, for something hoped for in the future. Its answer is a past verb, often with لَ (as with لَوْلَا in story 1: لَبَقِيَ): فَلَوِ انْتَهَيْنَا إِلَيْهِ
    قَطَعَ عَنَّا هٰذَا الشَّرَكَ. And وَإِنْ, even if, can stand without an answer of its own: وَإِنْ أَدْرَكَكَ الْفُتُورُ. Compare لَوْلَا from story 1.
  examples:
    - [فَإِنْ نَحْنُ أَخَذْنَا فِي الْفَضَاءِ لَمْ يَخْفَ عَلَيْهِ أَمْرُنَا, "If we set off across the open sky, our course will not be hidden from him. (in, answer with لَمْ)"]
    - [وَإِنْ نَحْنُ تَوَجَّهْنَا إِلَى الْعُمْرَانِ خَفِيَ عَلَيْهِ أَمْرُنَا, "If we head for the inhabited land, we will be hidden from him. (in, answer a past verb)"]
    - [فَلَوِ انْتَهَيْنَا إِلَيْهِ قَطَعَ عَنَّا هٰذَا الشَّرَكَ, "If we reached him, he would cut this snare off us. (law)"]

tip:
  title: "Reading without vowels: Ibn al-Muqaffa's signposts"
  body: >-
    Classical prose has no paragraphs or quotation marks, so the author gives you signposts. زعموا أنه (they claim that) opens the tale.
    فبينما ... إذ ... (while ... suddenly ...) marks the moment something happens. ثم إن starts a new step of the action. قال and قالت tell you who
    speaks, and the speech simply follows. Watch the endings: a ن at the end of a verb (فوقعن, فعلقن, يلتقطنه, أقلعن) is the feminine plural,
    the doves; the same verb without it (فأقبل, نصب) is the hunter or the rat. Ibn al-Muqaffa also describes with a pair of إِضَافَاتٌ (مُضَافٌ + مُضَافٌ إِلَيْهِ):
    قبيح المنظر، سيئ الخلق, ugly of looks, bad of character. Finally, a few words keep their vowels because the bare letters lie:
    الشرك (snare, not shirk), حيني (my doom, not my time).

reread: Read the original twice without help. Then read the retelling from booklet 2 (The Ring Dove) and find three things Ibn al-Muqaffa says that the retelling left out. This booklet stops where the doves are set free; in the full chapter the story goes on with the crow, the rat, the tortoise and the gazelle.
