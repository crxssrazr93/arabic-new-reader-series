# Booklet 5, story 3. Tale strand, capstone: the original text of Ibn al-Muqaffa'. Grammar ceiling: Madinah Book 3.
id: b5-03
booklet: 5
number: 3
strand: tale
title_ar: الْحَمَامَةُ الْمُطَوَّقَةُ
title_en: "The Ring Dove (the original text)"
madinah: "Book 3 (the conditional with إِنْ and لَوْ)"
source: "Kalila wa Dimna, Ibn al-Muqaffa', the chapter of the Ring Dove (abridged). Text from lexicon/sources/kalila/hamama-default.wiki: the whole opening frame and the dove episode, from the start of the chapter to the doves' release (فانطلقت المطوقة وحمامها معها), kept word for word; everything after it (the crow's friendship with the rat, the tortoise and the gazelle) is cut. Four slips in the source are corrected: م نفس to من نفس, وأنظرو to وأنظر, تخاذلنا to تخاذلن (the feminine plural, as the doves are addressed), and حجر to جحر (the rat's hole, twice). The vowelling is ours; the source has none."

