# Booklet 5, story 2. Modern strand (MSA, news register). Grammar ceiling: Madinah Book 3.
id: b5-02
booklet: 5
number: 2
strand: modern
title_ar: مَدْرَسَةٌ فِي كُولُومْبُو تُكَرِّمُ حُفَّاظَهَا الْجُدُدَ
title_en: A Colombo Madrasa Honours Its New Huffaz
madinah: "Book 3 (the relative clause: الاسم الموصول, its صلة and the returning pronoun; the clause after an indefinite noun)"
source: "Modern story in the style of a newspaper report. The madrasa, its numbers, the mayor and the guests are invented; the mayor and the guest scholar are not named, so that no real person is quoted. Hadith quoted: 'the best of you are those who learn the Quran and teach it' (al-Bukhari 5027, from 'Uthman); 'the one skilled in the Quran is with the noble, righteous scribes' (Muslim 798); 'the most beloved deeds to Allah are the most constant, even if small' (al-Bukhari 6464, Muslim 783); 'read the Quran, for it will come on the Day of Resurrection as an intercessor for its companions' (Muslim 804). That the scribes (as-safara) are angels follows 80:15 and 16 and the commentators. 'Man sabara zafira' is a proverb, not a hadith."

