dictionary:
  - {ar: حَفْلٌ, en: ceremony; celebration, pos: [اسم, noun], root: حفل, pattern: فَعْلٌ, plural: حُفُولٌ, register: modern, note: "Also حَفْلَةٌ, whose plural is حَفَلَاتٌ. A wedding is حَفْلُ زِفَافٍ; a graduation is حَفْلُ تَخَرُّجٍ. The verb احْتَفَلَ بِـ is to celebrate something."}
  - {ar: كَرَّمَ, en: he honoured, pos: [فعل ماض, past verb], present: يُكَرِّمُ, bab: بَابُ التَّفْعِيلِ, root: كرم, pattern: فَعَّلَ, ayah: {ref: "17:70", text: وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ, en: "and We have honoured the children of Adam"}, note: "Its مَصْدَرٌ (verbal noun) تَكْرِيمٌ, an honouring, is a common headline word; those honoured are الْمُكَرَّمُونَ, اسْمُ مَفْعُولٍ (the ones it was done to)."}
  - {ar: أَتَمَّ, en: he completed; he finished, pos: [فعل ماض, past verb], present: يُتِمُّ, bab: بَابُ الْإِفْعَالِ, root: تمم, pattern: أَفْعَلَ, ayah: {ref: "5:3", text: الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي, en: "today I have perfected your religion for you and completed My favour upon you"}, note: "From تَمَّ, it was complete. With a doubled root the verb shows only one م before a vowel: أَتَمُّوا, they completed. فِي تَمَامِ السَّاعَةِ الرَّابِعَةِ: at exactly four o'clock."}
  - {ar: سَنَوِيٌّ, en: annual; yearly, pos: [صفة, adjective], root: سنو, pattern: فَعَلِيٌّ, register: modern, ayah: {ref: "29:14", text: فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًا, en: "and he stayed among them a thousand years less fifty"}, note: "The ending ـِيٌّ (nisba) makes an adjective from a noun: سَنَةٌ, year, gives سَنَوِيٌّ, yearly; دِرَاسَةٌ gives دِرَاسِيٌّ. The ayah is about Nuh عَلَيْهِ السَّلَامُ and uses both words for year."}
  - {ar: عَامٌ, en: year, pos: [اسم, noun], root: عوم, pattern: فَعَلٌ, plural: أَعْوَامٌ, ayah: {ref: "12:49", text: ثُمَّ يَأْتِي مِن بَعْدِ ذَٰلِكَ عَامٌ فِيهِ يُغَاثُ النَّاسُ, en: "then after that will come a year in which people are given rain"}, note: "A news report says هٰذَا الْعَامَ, this year, as ظَرْفُ زَمَانٍ مَنْصُوبٌ (accusative of time). عَامٌ and سَنَةٌ mean the same in modern Arabic."}
  - {ar: قَاعَةٌ, en: hall; large room, pos: [اسم, noun], root: قوع, pattern: فَعَلَةٌ, plural: قَاعَاتٌ, register: modern, ayah: {ref: "20:106", text: فَيَذَرُهَا قَاعًا صَفْصَفًا, en: "and He will leave it a level, empty plain"}, note: "From the same root as قَاعٌ, a flat open plain: a hall is a wide flat space. قَاعَةُ الدَّرْسِ is a classroom, قَاعَةُ الِانْتِظَارِ a waiting room."}
  - {ar: حُضُورٌ, en: presence; (modern) the audience, pos: [مصدر, verbal noun], root: حضر, pattern: فُعُولٌ, register: both, ayah: {ref: "2:180", text: إِذَا حَضَرَ أَحَدَكُمُ الْمَوْتُ, en: "when death comes to one of you"}, note: "مَصْدَرُ حَضَرَ (verbal noun of حَضَرَ), he was present. بِحُضُورِ, in the presence of, is a fixed news phrase. In modern Arabic الْحُضُورُ also means the people present, the audience, and takes a plural or singular verb."}
  - {ar: عُمْدَةٌ, en: "mayor; (classical) a pillar, a support", pos: [اسم, noun], root: عمد, pattern: فُعْلَةٌ, register: both, ayah: {ref: "13:2", text: رَفَعَ السَّمَاوَاتِ بِغَيْرِ عَمَدٍ تَرَوْنَهَا, en: "He raised the heavens without pillars that you can see"}, note: "Classical: the thing one leans on. Modern: the mayor of a town, the one the town relies on. Another word for mayor is رَئِيسُ الْبَلَدِيَّةِ."}
  - {ar: مِنَصَّةٌ, en: stage; platform, pos: [اسم, noun], root: نصص, pattern: مِفْعَلَةٌ, register: modern, note: "From نَصَّ, to raise or set up. A modern word: مِنَصَّةٌ is also an online platform. From the same root comes نَصٌّ, a text."}
  - {ar: كَلِمَةٌ, en: word; (modern) a speech, pos: [اسم, noun], root: كلم, pattern: فَعِلَةٌ, plural: كَلِمَاتٌ, register: both, ayah: {ref: "14:24", text: كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً كَشَجَرَةٍ طَيِّبَةٍ, en: "how Allah gives the example of a good word, like a good tree"}, note: "In news Arabic أَلْقَى كَلِمَةً means he gave a speech, and كَلِمَةُ الطُّلَّابِ is the speech on behalf of the students."}
  - {ar: جُهْدٌ, en: effort, pos: [اسم, noun], root: جهد, pattern: فُعْلٌ, plural: جُهُودٌ, ayah: {ref: "9:79", text: وَالَّذِينَ لَا يَجِدُونَ إِلَّا جُهْدَهُمْ, en: "and those who find nothing (to give) but their effort"}, note: "Same root as جِهَادٌ, striving, and اجْتَهَدَ, he worked hard. Speeches thank people عَلَى جُهُودِهِمْ, for their efforts."}
  - {ar: أَعْرَبَ, en: he expressed (a feeling), pos: [فعل ماض, past verb], present: يُعْرِبُ, bab: بَابُ الْإِفْعَالِ, root: عرب, pattern: أَفْعَلَ, register: modern, ayah: {ref: "12:2", text: إِنَّا أَنزَلْنَاهُ قُرْآنًا عَرَبِيًّا, en: "We have sent it down as an Arabic Quran"}, note: "News phrase: أَعْرَبَ عَنْ سَعَادَتِهِ, he expressed his happiness. The root means to be clear; that is why Arabic is عَرَبِيٌّ, clear speech. In nahw, إِعْرَابٌ is the case endings."}
  - {ar: أَشَادَ, en: he praised (with بِـ), pos: [فعل ماض, past verb], present: يُشِيدُ, bab: بَابُ الْإِفْعَالِ, root: شيد, pattern: أَفْعَلَ, register: modern, ayah: {ref: "22:45", text: وَبِئْرٍ مُّعَطَّلَةٍ وَقَصْرٍ مَّشِيدٍ, en: "and an abandoned well and a lofty palace"}, note: "News phrase: أَشَادَ بِدَوْرِ الْمَدْرَسَةِ, he praised the role of the madrasa. The root means to raise high, as in a lofty building (مَشِيدٌ): to praise is to raise someone's name."}
  - {ar: أَشَارَ, en: he pointed (to); he pointed out, pos: [فعل ماض, past verb], present: يُشِيرُ, bab: بَابُ الْإِفْعَالِ, root: شور, pattern: أَفْعَلَ, ayah: {ref: "19:29", text: فَأَشَارَتْ إِلَيْهِ, en: "so she pointed to him"}, note: "Classical: to point with the hand, as Maryam عَلَيْهَا السَّلَامُ pointed to her son Isa عَلَيْهِ السَّلَامُ (19:29). News: أَشَارَ إِلَى أَنَّ, he pointed out that. إِشَارَةٌ is a sign or signal."}
  - {ar: مُرَاجَعَةٌ, en: revision; review, pos: [مصدر, verbal noun], root: رجع, pattern: مُفَاعَلَةٌ, register: modern, ayah: {ref: "2:156", text: إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ, en: "we belong to Allah and to Him we return"}, note: "مَصْدَرُ رَاجَعَ (verbal noun of رَاجَعَ), in بَابُ الْمُفَاعَلَةِ: to go back over something again and again. Every hafiz knows the word: مُرَاجَعَةُ الْحِفْظِ."}
  - {ar: شَهَادَةٌ, en: testimony; (modern) a certificate, pos: [اسم, noun], root: شهد, pattern: فَعَالَةٌ, plural: شَهَادَاتٌ, register: both, ayah: {ref: "2:283", text: وَلَا تَكْتُمُوا الشَّهَادَةَ, en: "and do not hide testimony"}, note: "Classical: bearing witness, and the shahada of faith. Modern: a certificate or diploma, the paper that bears witness that you passed."}
  - {ar: هَدِيَّةٌ, en: gift; present, pos: [اسم, noun], root: هدي, pattern: فَعِيلَةٌ, plural: هَدَايَا, ayah: {ref: "27:35", text: وَإِنِّي مُرْسِلَةٌ إِلَيْهِم بِهَدِيَّةٍ, en: "and I am going to send them a gift"}, note: "The Queen of Sheba's words about Sulayman عَلَيْهِ السَّلَامُ. Do not confuse it with هِدَايَةٌ, guidance, from the same root."}
  - {ar: جَائِزَةٌ, en: prize; award, pos: [اسم, noun], root: جوز, pattern: فَاعِلَةٌ, plural: جَوَائِزُ, register: modern, ayah: {ref: "10:90", text: وَجَاوَزْنَا بِبَنِي إِسْرَائِيلَ الْبَحْرَ, en: "and We brought the Children of Israel across the sea"}, note: "The root means to pass across. The plural جَوَائِزُ is a diptote: عَلَى جَوَائِزَ خَاصَّةٍ, with no kasra or tanwin."}
  - {ar: اِخْتِبَارٌ, en: test; examination, pos: [مصدر, verbal noun], root: خبر, pattern: اِفْتِعَالٌ, plural: اِخْتِبَارَاتٌ, register: modern, ayah: {ref: "67:14", text: وَهُوَ اللَّطِيفُ الْخَبِيرُ, en: "and He is the Subtle, the All-Aware"}, note: "مَصْدَرُ اخْتَبَرَ (verbal noun), in بَابُ الِافْتِعَالِ: to test, to find out what someone knows. You know خَبَرٌ, news, from the same root."}
  - {ar: قُدْوَةٌ, en: model; example to follow, pos: [اسم, noun], root: قدو, pattern: فُعْلَةٌ, ayah: {ref: "6:90", text: أُولَـٰئِكَ الَّذِينَ هَدَى اللَّهُ فَبِهُدَاهُمُ اقْتَدِهْ, en: "those are the ones Allah guided, so follow their guidance"}, note: "From the same root as اقْتَدَى بِـ, he followed someone's example. A good قُدْوَةٌ is someone others copy."}
  - {ar: خِتَامٌ, en: close; end, pos: [اسم, noun], root: ختم, pattern: فِعَالٌ, ayah: {ref: "83:26", text: خِتَامُهُ مِسْكٌ, en: "its last taste is musk"}, note: "News phrase: فِي خِتَامِ الْحَفْلِ, at the close of the ceremony. A khatm of the Quran is a reading of it to the end, from the same root."}
  - {ar: وَالِدٌ, en: father; parent, pos: [اسم فاعل, active participle], root: ولد, pattern: فَاعِلٌ, ayah: {ref: "17:23", text: وَبِالْوَالِدَيْنِ إِحْسَانًا, en: "and (be) good to parents"}, note: "Feminine وَالِدَةٌ, mother; the dual الْوَالِدَانِ, parents. More formal than أَبٌ and أُمٌّ, so it is the usual word in a news report."}
  - {ar: تِلَاوَةٌ, en: recitation, pos: [مصدر, verbal noun], root: تلو, pattern: فِعَالَةٌ, ayah: {ref: "2:121", text: يَتْلُونَهُ حَقَّ تِلَاوَتِهِ, en: "they recite it as it ought to be recited"}, note: "مَصْدَرُ تَلَا يَتْلُو (verbal noun), he recited; the root also means to follow, since one ayah follows another."}

