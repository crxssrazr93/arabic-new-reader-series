grammar:
  title_ar: الِاسْمُ الْمَوْصُولُ وَصِلَتُهُ
  title_en: "The relative clause: who, which, that"
  body: >-
    A relative pronoun links a noun to a whole sentence that describes it, called its صِلَة. It agrees with the noun: الَّذِي and الَّتِي for
    one, الَّذِينَ for men or a mixed group, اللَّاتِي for women. The sentence after it usually holds a pronoun that points back to the
    noun, the عَائِد: رِحْلَةُ الْحِفْظِ الَّتِي قَطَعَهَا الطُّلَّابُ (the ـهَا in قَطَعَهَا is the عَائِد: it points back to الرِّحْلَةُ). Sometimes the عَائِد is hidden: in الطَّالِبُ الَّذِي يَحْفَظُ it is the hidden هُوَ inside يَحْفَظُ, a ضَمِيرٌ مُسْتَتِرٌ, and it is the فَاعِلٌ (doer) of the verb. When the noun is
    indefinite, Arabic drops the relative pronoun and the sentence follows the noun directly and describes it (a صِفَةٌ, describing word): صَفْحَةً حَفِظَهَا, a page (that) he had learned,
    exactly as English can drop that. News writing is full of both kinds, so when a noun is followed by a verb, ask: is this a new sentence,
    or a description of the noun?
  examples:
    - [الطُّلَّابِ الَّذِينَ أَتَمُّوا حِفْظَ كِتَابِ اللَّهِ, "the students who completed the memorisation of Allah's Book"]
    - [وَامْتَلَأَتِ الْقَاعَةُ الَّتِي تَتَّسِعُ لِخَمْسِمِائَةِ شَخْصٍ, "the hall, which holds five hundred people, was full"]
    - [قِصَّةَ أَيَّامٍ كَانَ يَنْسَى فِيهَا صَفْحَةً حَفِظَهَا قَبْلَ أُسْبُوعٍ, "the story of days when he would forget a page he had learned a week before (indefinite nouns: no relative pronoun, the returning pronoun is ـها)"]

tip:
  title: "Reading without vowels: the newspaper's fixed phrases"
  body: >-
    News Arabic repeats a small set of phrases, and once you know them you can read them without vowels at a glance. أقيم الحفل (the
    ceremony was held) and يذكر أن (it is worth noting that) are passive: أُقِيمَ, يُذْكَرُ. بحضور is in the presence of; ومن جهته is for his part;
    وأضاف أن is he added that; وأشار إلى أن is he pointed out that; وأعرب عن is he expressed; وأشاد بـ is he praised; في ختام is at the close of.
    After قال, the next word is إنّ (قال إنّ المدرسة); after أضاف, أوضح and أكد it is أنّ. The verb usually comes first and is singular even
    with a plural فاعل (doer) (وجلس الحفاظ), so look for the فاعل after it. The hamza on و has two spellings: يقرؤون or يقرءون, اقرؤوا or اقرءوا; both are correct.

reread: Read the report once quickly for the facts, as you would read a newspaper. Then read it again slowly and underline every relative pronoun and the noun it describes.
