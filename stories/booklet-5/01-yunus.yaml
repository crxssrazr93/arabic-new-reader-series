# Booklet 5, story 1. Quran strand. Grammar ceiling: Madinah Book 3.
id: b5-01
booklet: 5
number: 1
strand: quran
title_ar: يُونُسُ فِي الظُّلُمَاتِ
title_en: Yunus in the Darkness
madinah: "Book 3 (لَوْلَا and the conditional of what did not happen, with لَ in its answer)"
source: "Quran 37:139 to 148, 21:87 and 88, 68:48 to 50 and 10:98, in this order: 37:139; 21:87 (he left angry); 37:140 to 142; 21:87 (the prayer in the darknesses); 37:143 and 144; 21:88; 68:49; 37:145 and 146; 68:50; 37:147 and 148; 10:98; 68:48. Explanations follow Ibn Kathir: his anger was with his people (so also al-Baghawi); 'thought We would not constrain him' (21:87). Al-Qurtubi: he left before Allah permitted him, abaqa is used of a slave who runs from his master (so also al-Baghawi), and 'that is why Allah called him muleem' (21:87, 37:140, 37:142); the storm and the lots to lighten the ship are as the commentators relate them; the three darknesses (belly of the fish, sea, night) are reported from Ibn Mas'ud and Ibn 'Abbas; most commentators take yaqtin to be the gourd (dubba'); some hold that his tasbih in days of ease is meant in 37:143; some hold the hundred thousand were his first people. Hadith: his father's name and 'no servant should say I am better than Yunus son of Matta' (al-Bukhari 3395, 3416; Muslim 2376); the Prophet picking out the gourd in the dish (al-Bukhari 5379); 'the prayer of Dhun-Nun' (reported in at-Tirmidhi 3505, graded sahih by many scholars). The fish is not drawn; no name is given for the town, since the Quran does not give it."

