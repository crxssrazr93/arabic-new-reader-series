dictionary:
  - {ar: مُرْسَلٌ, en: one who is sent; a messenger, pos: [اسم مفعول, passive participle], root: رسل, pattern: مُفْعَلٌ, plural: مُرْسَلُونَ, ayah: {ref: "37:139", text: وَإِنَّ يُونُسَ لَمِنَ الْمُرْسَلِينَ, en: "and Yunus was one of the messengers"}, note: "From أَرْسَلَ, he sent, which you met in Surat al-Fil. The one who sends is مُرْسِلٌ, with kasra; the one sent is مُرْسَلٌ, with fatha. Without vowels both are مرسل, so let the sentence tell you which."}
  - {ar: نُونٌ, en: great fish; the letter nun, pos: [اسم, noun], root: نون, pattern: فُعْلٌ, ayah: {ref: "21:87", text: وَذَا النُّونِ إِذ ذَّهَبَ مُغَاضِبًا, en: "and Dhun-Nun, when he went off in anger"}, note: "ذُو النُّونِ, the one of the fish, is a name for Yunus عَلَيْهِ السَّلَامُ. ذُو changes with the case: ذُو, ذَا, ذِي."}
  - {ar: غَاضَبَ, en: he was angry (with someone), pos: [فعل ماض, past verb], present: يُغَاضِبُ, bab: بَابُ الْمُفَاعَلَةِ, root: غضب, pattern: فَاعَلَ, ayah: {ref: "21:87", text: إِذ ذَّهَبَ مُغَاضِبًا, en: "when he went off in anger"}, note: "Made from غَضِبَ, which you know. Its اسْمُ فَاعِلٍ (doer noun) is مُغَاضِبٌ. Ibn Kathir and al-Baghawi say Yunus عَلَيْهِ السَّلَامُ was angry with his people, and al-Baghawi says this view best suits a prophet."}
  - {ar: أَبَقَ, en: he ran away (of a slave from his master), pos: [فعل ماض, past verb], present: يَأْبِقُ, bab: بَابُ ضَرَبَ, root: أبق, pattern: فَعَلَ, ayah: {ref: "37:140", text: إِذْ أَبَقَ إِلَى الْفُلْكِ الْمَشْحُونِ, en: "when he ran off to the laden ship"}, note: "A runaway slave is آبِقٌ. The word shows that a prophet's leaving his post without leave is a serious matter."}
  - {ar: مَشْحُونٌ, en: laden; fully loaded, pos: [اسم مفعول, passive participle], root: شحن, pattern: مَفْعُولٌ, ayah: {ref: "36:41", text: فِي الْفُلْكِ الْمَشْحُونِ, en: "in the laden ship"}, register: both, note: "Classical: loaded full. Modern: شَحَنَ is to ship goods or to charge a battery (شَحَنَ الْهَاتِفَ), and a lorry is شَاحِنَةٌ. You also know this ayah from Surat Ya Sin."}
  - {ar: سَاهَمَ, en: he cast lots; (modern) he took part; he contributed, pos: [فعل ماض, past verb], present: يُسَاهِمُ, bab: بَابُ الْمُفَاعَلَةِ, root: سهم, pattern: فَاعَلَ, ayah: {ref: "37:141", text: فَسَاهَمَ فَكَانَ مِنَ الْمُدْحَضِينَ, en: "then he cast lots and was among the losers"}, register: both, note: "From سَهْمٌ, an arrow, because lots were drawn with marked arrows (plural سِهَامٌ). In a modern newspaper سَاهَمَ فِي means he contributed to, and أَسْهُمٌ are company shares."}
  - {ar: اِلْتَقَمَ, en: he swallowed, pos: [فعل ماض, past verb], present: يَلْتَقِمُ, bab: بَابُ الِافْتِعَالِ, root: لقم, pattern: اِفْتَعَلَ, ayah: {ref: "37:142", text: فَالْتَقَمَهُ الْحُوتُ وَهُوَ مُلِيمٌ, en: "then the great fish swallowed him while he was blameworthy"}, note: "لُقْمَةٌ is a mouthful, one bite of food."}
  - {ar: لَامَ, en: he blamed, pos: [فعل ماض, past verb], present: يَلُومُ, bab: بَابُ نَصَرَ, root: لوم, pattern: فَعَلَ, ayah: {ref: "75:2", text: وَلَا أُقْسِمُ بِالنَّفْسِ اللَّوَّامَةِ, en: "and I swear by the self-reproaching soul"}, note: "With لَمْ it becomes لَمْ يَلُمْ. مَلُومٌ is blamed; مُلِيمٌ (37:142) is one who has done something to be blamed for."}
  - {ar: ظُلْمَةٌ, en: darkness, pos: [اسم, noun], root: ظلم, pattern: فُعْلَةٌ, plural: ظُلُمَاتٌ, ayah: {ref: "2:257", text: يُخْرِجُهُم مِّنَ الظُّلُمَاتِ إِلَى النُّورِ, en: "He brings them out of the darknesses into the light"}, note: "Same root as ظَلَمَ, he wronged. Without vowels ظلم can be ظُلْمٌ (wrong) or ظَلَمَ (he wronged); ظلمة with ة is always darkness."}
  - {ar: سُبْحَانَ, en: glory be to; far above (any flaw), pos: [مصدر, verbal noun], root: سبح, pattern: فُعْلَانٌ, ayah: {ref: "17:1", text: سُبْحَانَ الَّذِي أَسْرَىٰ بِعَبْدِهِ, en: "glory be to the One who took His servant by night"}, note: "Always followed by the one glorified: سُبْحَانَ اللَّهِ, سُبْحَانَكَ. From the same root: تَسْبِيحٌ, glorifying, and مُسَبِّحٌ, one who glorifies (37:143)."}
  - {ar: بَطْنٌ, en: belly; inside, pos: [اسم, noun], root: بطن, pattern: فَعْلٌ, plural: بُطُونٌ, ayah: {ref: "37:144", text: لَلَبِثَ فِي بَطْنِهِ إِلَىٰ يَوْمِ يُبْعَثُونَ, en: "he would have stayed in its belly until the Day they are raised"}, note: "Its opposite is ظَهْرٌ, back. Allah's names الظَّاهِرُ and الْبَاطِنُ, the Manifest and the Hidden (57:3), come from these two roots."}
  - {ar: نَبَذَ, en: he cast; he threw down, pos: [فعل ماض, past verb], present: يَنْبِذُ, bab: بَابُ ضَرَبَ, root: نبذ, pattern: فَعَلَ, ayah: {ref: "104:4", text: كَلَّا لَيُنبَذَنَّ فِي الْحُطَمَةِ, en: "no, he will surely be thrown into the Crusher"}, note: "Passive: نُبِذَ, he was cast (68:49). It means to cast or throw down: in 37:145 Allah cast him onto the bare shore. Only in 104:4 does it mean throwing something away as worthless."}
  - {ar: عَرَاءٌ, en: open bare land, pos: [اسم, noun], root: عري, pattern: فَعَالٌ, ayah: {ref: "37:145", text: فَنَبَذْنَاهُ بِالْعَرَاءِ وَهُوَ سَقِيمٌ, en: "then We cast him onto the bare land while he was sick"}, note: "Land with no plants and no building. From the same root: عَارٍ, feminine عَارِيَةٌ, bare or naked."}
  - {ar: سَقِيمٌ, en: sick; ill, pos: [صفة مشبهة, adjective of a lasting quality], root: سقم, pattern: فَعِيلٌ, ayah: {ref: "37:89", text: فَقَالَ إِنِّي سَقِيمٌ, en: "and he said: I am sick"}, note: "It is also the word Ibrahim عَلَيْهِ السَّلَامُ used on the day he broke the idols: إِنِّي سَقِيمٌ (37:89). An illness is سُقْمٌ or سَقَمٌ."}
  - {ar: أَنْبَتَ, en: he made (a plant) grow, pos: [فعل ماض, past verb], present: يُنْبِتُ, bab: بَابُ الْإِفْعَالِ, root: نبت, pattern: أَفْعَلَ, ayah: {ref: "37:146", text: وَأَنبَتْنَا عَلَيْهِ شَجَرَةً مِّن يَقْطِينٍ, en: "and We made a gourd plant grow over him"}, note: "From نَبَتَ, it grew. A plant is نَبَاتٌ."}
  - {ar: يَقْطِينٌ, en: gourd plant, pos: [اسم, noun], root: قطن, pattern: يَفْعِيلٌ, ayah: {ref: "37:146", text: شَجَرَةً مِّن يَقْطِينٍ, en: "a plant of gourd"}, note: "Most commentators say it is الدُّبَّاءُ, the gourd, a creeping plant with very large leaves. The Arabs called any plant a شَجَرَةٌ, even one with no trunk."}
  - {ar: أَلْفٌ, en: thousand, pos: [اسم, noun], root: ألف, pattern: فَعْلٌ, plural: آلَافٌ; أُلُوفٌ, ayah: {ref: "97:3", text: لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ, en: "the Night of Decree is better than a thousand months"}, note: "مِائَةُ أَلْفٍ is a hundred thousand. Like مِائَةٌ, the word after أَلْفٌ is مَجْرُورٌ (genitive) and singular: أَلْفُ شَهْرٍ, أَلْفُ سَنَةٍ."}
  - {ar: مَتَّعَ, en: he let (someone) enjoy, pos: [فعل ماض, past verb], present: يُمَتِّعُ, bab: بَابُ التَّفْعِيلِ, root: متع, pattern: فَعَّلَ, ayah: {ref: "37:148", text: فَآمَنُوا فَمَتَّعْنَاهُمْ إِلَىٰ حِينٍ, en: "then they believed, so We let them enjoy life for a time"}, note: "From the same root as مَتَاعٌ, goods, things to use and enjoy, which you met in the story of Yusuf عَلَيْهِ السَّلَامُ."}
  - {ar: اِسْتَجَابَ, en: he answered (a call or a prayer), pos: [فعل ماض, past verb], present: يَسْتَجِيبُ, bab: بَابُ الِاسْتِفْعَالِ, root: جوب, pattern: اِسْتَفْعَلَ, ayah: {ref: "21:88", text: فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنَ الْغَمِّ, en: "so We answered him and saved him from the distress"}, note: "It takes لِـ: اسْتَجَابَ لَهُ. The plain answer to a question is أَجَابَ, in بَابُ الْإِفْعَالِ, which you will meet in story 3."}
  - {ar: غَمٌّ, en: distress; grief that covers the heart, pos: [اسم, noun], root: غمم, pattern: فَعْلٌ, plural: غُمُومٌ, ayah: {ref: "21:88", text: وَنَجَّيْنَاهُ مِنَ الْغَمِّ, en: "and We saved him from the distress"}, note: "The root means to cover. غَمَامٌ, clouds that cover the sky, comes from it too."}
  - {ar: اِجْتَبَى, en: he chose; he selected, pos: [فعل ماض, past verb], present: يَجْتَبِي, bab: بَابُ الِافْتِعَالِ, root: جبي, pattern: اِفْتَعَلَ, ayah: {ref: "68:50", text: فَاجْتَبَاهُ رَبُّهُ فَجَعَلَهُ مِنَ الصَّالِحِينَ, en: "then his Lord chose him and made him one of the righteous"}, note: "Used in the Quran for Allah choosing His prophets."}
  - {ar: مَكْظُومٌ, en: filled with grief held in, pos: [اسم مفعول, passive participle], root: كظم, pattern: مَفْعُولٌ, ayah: {ref: "68:48", text: إِذْ نَادَىٰ وَهُوَ مَكْظُومٌ, en: "when he called out, filled with distress"}, note: "From كَظَمَ, he held back (his anger or grief). The praised believers are الْكَاظِمِينَ الْغَيْظَ, those who hold back their anger (3:134)."}
  - {ar: عَذَابٌ, en: punishment, pos: [اسم, noun], root: عذب, pattern: فَعَالٌ, ayah: {ref: "10:98", text: كَشَفْنَا عَنْهُمْ عَذَابَ الْخِزْيِ فِي الْحَيَاةِ الدُّنْيَا, en: "We lifted from them the punishment of disgrace in the life of this world"}, note: "The same letters as عَذْبٌ, sweet water, from booklet 1, but with a long alif: عذاب. One letter changes the meaning completely."}
  - {ar: كَشَفَ, en: he removed; he uncovered, pos: [فعل ماض, past verb], present: يَكْشِفُ, bab: بَابُ ضَرَبَ, root: كشف, pattern: فَعَلَ, ayah: {ref: "27:62", text: أَمَّن يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ, en: "or who answers the desperate one when he calls on Him, and removes the harm?"}, register: both, note: "Classical: to lift away a harm. Modern: to uncover or reveal (كَشَفَ عَنْ سِرٍّ), and كَشْفٌ is also a list or a medical examination. مَكْشُوفٌ is open, exposed."}
  - {ar: رِيحٌ, en: wind, pos: [اسم, noun], root: روح, pattern: فِعْلٌ, plural: رِيَاحٌ, ayah: {ref: "10:22", text: جَاءَتْهَا رِيحٌ عَاصِفٌ, en: "a storm wind comes upon it"}, note: "Feminine, so اشْتَدَّتِ الرِّيحُ. The ayah is from Surat Yunus and describes a ship in a storm, just like this story."}

