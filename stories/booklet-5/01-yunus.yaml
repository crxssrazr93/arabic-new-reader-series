grammar:
  title_ar: لَوْلَا وَجَوَابُهَا
  title_en: "Lawla: had it not been for..."
  body: >-
    لَوْلَا means had it not been for. It names something that did happen, and its answer tells what would have happened without it, so
    the answer never happened. A noun after لَوْلَا is مَرْفُوعٌ (لَوْلَا تَسْبِيحُهُ, لَوْلَا رَحْمَةُ اللَّهِ), or it is followed by أَنَّ or أَنْ and a
    sentence (لَوْلَا أَنَّهُ كَانَ, لَوْلَا أَنْ تَدَارَكَهُ). The answer is a فِعْلٌ مَاضٍ (past verb), usually with لَ in front of it: لَلَبِثَ, لَبَقِيَ, لَنُبِذَ.
    So when you see لولا, look ahead for a verb starting with ل: that is where the sentence turns. Its sister لَوْ, if, works the same way
    but the madrasa calls it حَرْفُ امْتِنَاعٍ لِامْتِنَاعٍ (it names something that did not happen). In story 3 you will also see it for something hoped for in the future.
  examples:
    - [﴿فَلَوْلَا أَنَّهُ كَانَ مِنَ الْمُسَبِّحِينَ لَلَبِثَ فِي بَطْنِهِ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾, "Had he not been one of those who glorify, he would have stayed in its belly until the Day they are raised. (Quran 37:143 and 144)"]
    - [لَوْلَا تَسْبِيحُهُ لَبَقِيَ فِي بَطْنِ الْحُوتِ, "Had it not been for his glorifying, he would have remained in the fish's belly. (a noun after lawla)"]
    - [﴿لَّوْلَا أَن تَدَارَكَهُ نِعْمَةٌ مِّن رَّبِّهِ لَنُبِذَ بِالْعَرَاءِ وَهُوَ مَذْمُومٌ﴾, "Had a blessing from his Lord not reached him, he would have been cast onto the bare land, blamed. (Quran 68:49)"]

tip:
  title: "Reading without vowels: let the pattern speak"
  body: >-
    A bare word you have never seen is rarely a mystery: find its three root letters, then the letters added around them. مغاضبا has
    مُـ before the root and alif after the first letter: the pattern مُفَاعِل, someone doing the action with another (angry with someone).
    مشحونة is مَفْعُولَة, a thing the action was done to (laden). التقم and اجتبى have the ت of بَابُ الِافْتِعَالِ after the first letter, and استجاب has
    the است of بَابُ الِاسْتِفْعَالِ. المسبحين has a shadda you cannot see, but مُفَعِّل (from سَبَّحَ, بَابُ التَّفْعِيلِ) is the pattern that fits مُـ + root + ين for one who does
    something, since this root has no بَابُ الْإِفْعَالِ verb to give مُفْعِل. You are a hafiz, so the ayat will often finish the word for you; for everything else, the pattern does.

reread: Reread the story, then recite Surat as-Saffat 37:139 to 148 and Surat al-Anbiya' 21:87 and 88, and find each part of the story in them.
