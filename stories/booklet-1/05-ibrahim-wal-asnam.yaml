grammar:
  title_ar: النَّعْتُ وَالْمَنْعُوتُ
  title_en: "The نَعْتٌ (describing word) follows its مَنْعُوتٌ"
  body: >-
    A نَعْتٌ (describing word) comes after its مَنْعُوتٌ (the noun it describes) and copies it: in إِعْرَابٌ (case ending),
    in تَعْرِيفٌ and تَنْكِيرٌ (ال or tanwin), in gender and in number.
    One special rule: the plural of a thing that is not a person takes a feminine singular نَعْتٌ,
    so الْأَصْنَامُ (idols) takes الصَّغِيرَةُ, not a plural one.
  examples:
    - [الصَّنَمَ الْكَبِيرَ, "the big idol"]
    - [نَارًا عَظِيمَةً, "a great fire"]
    - [الْأَصْنَامَ الصَّغِيرَةَ, "the small idols"]

tip:
  title: "Reading without vowels: spotting the past verb"
  body: >-
    A bare three letter word at the start of a sentence, like كسر, ترك, ذهب or رجع, is very often a past verb on the
    pattern فَعَلَ: kasara, taraka. A few common verbs are فَعِلَ instead (سمع, غضب, فرح, خسر), so learn those as you meet them.
    A final ـوا (قالوا, رجعوا, ذكروا) means "they" did it, and its alif is silent.

