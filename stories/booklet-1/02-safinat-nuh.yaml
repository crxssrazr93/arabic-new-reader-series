grammar:
  title_ar: حَرْفُ الْجَرِّ وَالِاسْمُ الْمَجْرُورُ
  title_en: "Prepositions and the majrur noun"
  body: >-
    Words like فِي، مِنْ، إِلَى، عَلَى، عَنْ and the joined بِـ and كَـ are حُرُوفُ الْجَرِّ (prepositions). The noun right after one
    is مَجْرُورٌ (genitive): it ends in a kasra, or kasratan when it has no ال and is not the first noun of an idafa (عَلَى جَبَلِ الْجُودِيِّ). A pronoun can join straight on: فِيهَا, عَلَيْهِ.
    The word مَعَ ("with") is not a حَرْفٌ but an اسْمٌ, a ظَرْفٌ (adverb of place and time). The noun after it is مُضَافٌ إِلَيْهِ, so it is also مَجْرُورٌ.
  examples:
    - [فِي السَّفِينَةِ, "in the ship"]
    - [عَلَى جَبَلِ الْجُودِيِّ, "on Mount al-Judi"]
    - [مِن مَّاءٍ دَافِقٍ, "from a gushing fluid (Quran 86:6)"]

tip:
  title: "Reading without vowels: sun and moon letters"
  body: >-
    After ال, look at the next letter. If it is one of the 14 sun letters (ت ث د ذ ر ز س ش ص ض ط ظ ل ن) the lam is silent and
    the letter is doubled: السماء is as-samā', السفينة is as-safīna. Any other letter is a moon letter and the lam is read:
    الماء is al-mā', الأرض is al-arḍ, الجبال is al-jibāl. You never need the shadda printed to know this.

