grammar:
  title_ar: الضَّمَائِرُ الْمُتَّصِلَةُ
  title_en: "Attached pronouns"
  body: >-
    A short pronoun can join the end of a noun to show whose it is: ـِي my, ـكَ your, ـهُ his, ـهَا her.
    A noun with an attached pronoun is already definite, so it never takes ال or tanwin. After a kasra or ي, ـهُ becomes ـهِ: يَدِهِ، عَلَيْهِ.
  examples:
    - [طَعَامِي, "my food"]
    - [طَعَامِكَ, "your food"]
    - [فِي يَدِهِ, "in his hand"]

tip:
  title: "Reading without vowels: the ة ending"
  body: >-
    A word ending in ة (رائحة, قصة, قطعة) is almost always feminine. Read the ة as -a when you stop on it.
    When another word joins on in idafa, read it as -at: رائحة الطعام is rā'iḥatu ṭ-ṭa'ām. An adjective after it
    usually ends in ة too: رائحة طيبة.

