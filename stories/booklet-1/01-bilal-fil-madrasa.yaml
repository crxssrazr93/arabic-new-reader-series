grammar:
  title_ar: الْمُضَافُ وَالْمُضَافُ إِلَيْهِ
  title_en: "Idafa: joining two nouns"
  body: >-
    Two nouns side by side can mean "the X of Y". The first noun, الْمُضَافُ, never takes ال and never takes tanwin.
    The second noun, الْمُضَافُ إِلَيْهِ, is always مَجْرُورٌ (genitive, usually a kasra).
  examples:
    - [بَيْتُ بِلَالٍ, "Bilal's house (the house of Bilal)"]
    - [اِسْمُ الْمُعَلِّمِ, "the teacher's name"]
    - [صَبَاحُ الْمُنذَرِينَ, "the morning of those who were warned (Quran 37:177)"]

tip:
  title: "Reading without vowels: the فَاعِلٌ pattern"
  body: >-
    A word written with ا after its first root letter, like طالب or حافظ, is very often on the pattern فَاعِلٌ: "one who does".
    So without any marks you can read طالب as ṭālib and حافظ as ḥāfiẓ. The pattern gives you the vowels.

