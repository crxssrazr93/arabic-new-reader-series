grammar:
  title_ar: اِسْمُ الْإِشَارَةِ
  title_en: "Demonstratives: this and that"
  body: >-
    هٰذَا (this, masculine) and هٰذِهِ (this, feminine) point to something near; ذٰلِكَ and تِلْكَ point to something far.
    With a noun that has no ال they make a sentence: هٰذِهِ رِسَالَةٌ, "this is a letter".
    With a noun that has ال they make a phrase, "this river", and the sentence still needs its خَبَرٌ (predicate): هٰذَا النَّهْرُ طَوِيلٌ.
    So in ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ, "that Book" is the phrase and لَا رَيْبَ فِيهِ is its خَبَرٌ. Some scholars read الْكِتَابُ itself as the خَبَرٌ, "That is the Book".
  examples:
    - [هٰذِهِ رِسَالَةٌ, "This is a letter."]
    - [هٰذَا النَّهْرُ طَوِيلٌ, "This river is long."]
    - [ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ, "That Book: there is no doubt in it. (Quran 2:2)"]

tip:
  title: "Reading without vowels: the مَفْعَلٌ place pattern"
  body: >-
    A word that is م plus three root letters is very often a place: مكتبة (place of books), ملعب (place of play),
    مدرسة (place of study), مطبخ (place of cooking). Read the م with a fatha and the first root letter with a sukun:
    ma-k-ta-ba, ma-l-'a-b. A few have a kasra in the middle: مَسْجِدٌ، مَجْلِسٌ. If you know the root, you can guess both the meaning and the vowels.

