number: 1
title: First Steps to Meaning
title_ar: الْخُطُوَاتُ الْأُولَى
subtitle: Five stories with every word explained. Full vowel marks.
cover_image: cover-1.png
cover_prompt: A narrow lane in a Sri Lankan coastal town at early morning leading to a small white madrasa with a green door, palm trees and a minaret behind, a school bag resting on a low wall, no people.
vowels: full
parts: [3]
gloss: all
translation: inline
unvowelled: try
intro:
  - You already read the Quran beautifully. This booklet is about understanding what you read.
  - Every Arabic line has the meaning of each word printed under it in small grey letters, and the whole sentence in English below. Read the Arabic first, glance down only when you need to.
  - After each story comes a dictionary of its words. Every word shows its root (in red) and, wherever it appears in the Quran, an ayah you know by heart that uses it.
howto:
  - [1. Read, "Read the Arabic line aloud. Try to guess the meaning before you look at the grey words."]
  - [2. Check, "Use the grey words and the English line to check yourself."]
  - [3. Study, "Go through the dictionary. Say each ayah and find the word in it."]
  - [4. Reread, "Cover the grey line with a strip of paper and read the story again."]
